<style>
:root{--ink:#0f1923;--ink2:#1a2535;--ink3:#253347;--border:#2a3a50;--muted:#8a9bb0;--sub:#6a8a9a;--text:#e8f0f8;--gold:#c9a84c;--gold-l:#2a1e06;--gold-m:#3d2e0a;--teal:#2e7d4f;--teal-l:#0e2418;--teal-m:#1e4d30;--rose:#c0392b;--rose-l:#2a0a0a;--rose-m:#4a1a1a;--blue:#3a7bd5;--blue-l:#0a1a3a;--blue-m:#1a3a6a;--amber:#e0a030;--amber-l:#2a1e06;--amber-m:#5a4010;--sans:'DM Sans',sans-serif;--serif:'DM Serif Display',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--ink);color:var(--text);min-height:100vh}
button,input,select,textarea{font-family:var(--sans)}
.nav-bar{background:#0a1118;padding:7px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.nav-btn{display:flex;align-items:center;gap:6px;text-decoration:none;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:600;border:1px solid var(--border);color:var(--muted);background:var(--ink2);transition:.15s;cursor:pointer;white-space:nowrap}
.nav-btn:hover{color:#fff;border-color:#3a5a70}
.nav-btn.green{background:var(--teal-l);border-color:var(--teal-m);color:#4cd98a}
.nav-btn.gold{background:var(--gold-l);border-color:var(--gold-m);color:var(--gold)}
.nav-btn.blue{background:var(--blue-l);border-color:var(--blue-m);color:#7ab3f0}
.nav-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}
.topbar{background:var(--ink2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar-logo{font-family:var(--serif);font-size:19px;color:#fff}
.topbar-sep{flex:1}
.pill{border-radius:8px;padding:5px 14px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid}
.pill-teal{background:var(--teal-l);border-color:var(--teal-m);color:#4cd98a}
.pill-rose{background:var(--rose-l);border-color:var(--rose-m);color:#f07a7a}
.pill-gold{background:var(--gold-l);border-color:var(--gold-m);color:var(--gold)}
.btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{background:#3a9e65}
.btn-gold{background:var(--gold);color:#1a1a0a}.btn-gold:hover{background:#dbb85a}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}.btn-ghost:hover{color:#fff;border-color:#3a5a70}
.btn-rose{background:transparent;border-color:var(--rose-m);color:#f07a7a}.btn-rose:hover{background:var(--rose-l)}
.btn-sm{padding:5px 10px;font-size:11px}
.sync{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;color:#fff;opacity:0;transition:opacity .3s}
.tabs{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid var(--border);background:var(--ink)}
.tab{padding:9px 16px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:7px}
.tab:hover{color:#fff}
.tab.active{background:var(--ink2);border-color:var(--border);color:#fff;margin-bottom:-1px}
.tab .cnt{background:var(--rose);color:#fff;border-radius:10px;font-size:10px;padding:1px 7px}
.main{padding:20px;max-width:1500px;margin:0 auto}
.stat-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sc{flex:1;min-width:150px;border:1px solid var(--border);border-radius:12px;padding:12px 16px;background:var(--ink2)}
.sc.teal{background:var(--teal-l);border-color:var(--teal-m)}.sc.rose{background:var(--rose-l);border-color:var(--rose-m)}.sc.gold{background:var(--gold-l);border-color:var(--gold-m)}.sc.blue{background:var(--blue-l);border-color:var(--blue-m)}
.sc-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--sub);margin-bottom:4px}
.sc-val{font-family:var(--serif);font-size:22px}
.sc.teal .sc-val{color:#4cd98a}.sc.rose .sc-val{color:#f07a7a}.sc.gold .sc-val{color:var(--gold)}.sc.blue .sc-val{color:#7ab3f0}
.sc-sub{font-size:10px;color:var(--sub);margin-top:3px}
.grupo{background:var(--ink2);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden}
.grupo.critico{border-color:#6b2a2a}
.grupo-hd{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border)}
.grupo-hd h3{font-family:var(--serif);font-size:17px;font-weight:400;color:#fff}
.grupo-hd p{font-size:11px;color:var(--sub)}
.grupo-hd .n{margin-left:auto;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;background:var(--ink3);color:var(--muted)}
.grupo.critico .grupo-hd .n{background:var(--rose);color:#fff}
.item{display:flex;align-items:center;gap:14px;padding:11px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.item:first-of-type{border-top:none}
.item:hover{background:var(--ink3)}
.item-main{flex:1;min-width:220px;cursor:pointer}
.item-tit{font-size:13px;font-weight:700;color:#fff}
.item-sub{font-size:11px;color:var(--muted);margin-top:2px}
.item-val{font-size:12px;font-weight:700;color:var(--gold);min-width:100px;text-align:right}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}
.chip.ok{background:var(--teal-m);color:#4cd98a}.chip.atencao{background:var(--amber-m);color:#f0c060}.chip.atrasado{background:#6b1a1a;color:#ffb0b0}.chip.neutro{background:var(--ink3);color:var(--muted)}.chip.pago{background:var(--blue-m);color:#7ab3f0}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:800;letter-spacing:.3px;white-space:nowrap;background:var(--ink3);color:var(--muted)}
.vazio{padding:18px;font-size:12px;color:#4cd98a;text-align:center}
.tudo-ok{background:var(--teal-l);border:1px solid var(--teal-m);border-radius:14px;padding:28px;text-align:center;color:#4cd98a;font-size:14px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filtros input:not([type=checkbox]),.filtros select{background:var(--ink2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-size:12px;outline:none}
.filtros input:not([type=checkbox]){min-width:240px}
.filtros label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{min-width:250px;width:250px;background:var(--ink2);border:1px solid var(--border);border-radius:12px;flex-shrink:0;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.col.critico{border-color:#6b2a2a}
.col-hd{padding:11px 13px;border-bottom:1px solid var(--border)}
.col-hd .t{font-size:12px;font-weight:800;color:#fff;display:flex;justify-content:space-between;gap:6px}
.col-hd .q{font-size:10px;color:var(--sub);margin-top:2px}
.col-body{padding:9px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.card{background:var(--ink);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:9px;padding:10px 11px;cursor:pointer;transition:.15s}
.card:hover{border-color:#3a5a70;transform:translateY(-1px)}
.card.atencao{border-left-color:var(--amber)}.card.atrasado{border-left-color:#e24b4a}.card.neutro{border-left-color:var(--border)}.card.pago{border-left-color:var(--blue)}
.card .np{font-size:11px;font-weight:800;color:var(--gold)}
.card .ob{font-size:12px;color:#fff;margin:4px 0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .fo{font-size:10px;color:var(--muted)}
.card .ft{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:6px}
.card .vl{font-size:11px;font-weight:700;color:var(--text)}
.tbl-wrap{background:var(--ink2);border:1px solid var(--border);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--ink);padding:9px 12px;font-size:9px;font-weight:800;letter-spacing:.7px;color:var(--sub);text-transform:uppercase;text-align:left;white-space:nowrap}
td{padding:10px 12px;font-size:12px;color:var(--text);border-top:1px solid var(--border);vertical-align:middle}
tr.click:hover td{background:var(--ink3);cursor:pointer}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;z-index:900;overflow-y:auto;padding:40px 16px}
.modal-ov.open{display:flex}
.modal{background:var(--ink2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:640px;padding:26px 28px}
.modal.lg{max-width:900px}
.modal-tit{font-family:var(--serif);font-size:20px;color:#fff;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.fg label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fg label .req{color:#f07a7a}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;background:var(--ink);border:1.5px solid var(--border);border-radius:9px;color:#fff;font-size:13px;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--teal)}
.fg input[type=file]{padding:7px;font-size:12px}
.fg textarea{min-height:64px;resize:vertical}
.fg.erro input,.fg.erro select{border-color:#e24b4a}
.sec-lbl{grid-column:1/-1;font-size:10px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-top:8px;padding-top:10px;border-top:1px solid var(--border)}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--ink);border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;cursor:pointer;font-size:13px;color:var(--text)}
.check input{width:17px;height:17px;accent-color:var(--teal);margin-top:1px;flex-shrink:0}
.check.erro{border-color:#e24b4a}
.mfooter{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.msg-erro{color:#f07a7a;font-size:12px;margin-top:12px;display:none}
.aviso{background:var(--amber-l);border:1px solid var(--amber-m);color:#f0c060;border-radius:9px;padding:10px 13px;font-size:12px;margin-top:12px}
.stepper{display:flex;gap:0;margin:14px 0 18px;overflow-x:auto;padding-bottom:4px}
.st{flex:1;min-width:70px;text-align:center;position:relative}
.st .dot{width:14px;height:14px;border-radius:50%;background:var(--ink3);border:2px solid var(--border);margin:0 auto 5px;position:relative;z-index:1}
.st::before{content:'';position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--border)}
.st:first-child::before{display:none}
.st.feito .dot{background:var(--teal);border-color:var(--teal)}.st.feito::before{background:var(--teal)}
.st.atual .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,168,76,.2)}.st.atual::before{background:var(--teal)}
.st .nm{font-size:9px;color:var(--sub);line-height:1.25}
.st.atual .nm{color:var(--gold);font-weight:800}
.det-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;margin-bottom:16px}
.det-grid .k{font-size:9px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.det-grid .v{font-size:13px;color:#fff;margin-top:2px;word-break:break-word}
.det-grid .v.vazio-v{color:#3a4a5a}
.det-sec{font-size:10px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px;padding-top:12px;border-top:1px solid var(--border)}
.acao-box{background:var(--teal-l);border:1px solid var(--teal-m);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.acao-box.critico{background:var(--rose-l);border-color:var(--rose-m)}
.acao-box .txt{flex:1;min-width:200px;font-size:12px;color:var(--muted)}
.acao-box .txt b{display:block;color:#fff;font-size:14px;margin-bottom:2px}
.anx{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:12px}
.anx .nm{flex:1;color:#fff;cursor:pointer;word-break:break-all}.anx .nm:hover{text-decoration:underline}
.hist{border-left:2px solid var(--border);margin-left:6px;padding-left:14px}
.hist .h{position:relative;padding:4px 0 10px;font-size:12px;color:var(--text)}
.hist .h::before{content:'';position:absolute;left:-19px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.hist .h small{display:block;color:var(--sub);font-size:10px}
.toast{position:fixed;bottom:24px;right:24px;background:#1a3a2a;border:1px solid var(--teal);color:#4cd98a;padding:11px 18px;border-radius:10px;font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;z-index:2000;pointer-events:none}
.toast.erro{background:#2a1a1a;border-color:#6b2a2a;color:#f08080}
.bloqueio{max-width:440px;margin:90px auto;text-align:center;background:var(--ink2);border:1px solid var(--border);border-radius:16px;padding:36px}
.bloqueio h2{font-family:var(--serif);font-weight:400;color:#fff;margin:10px 0}
.bloqueio p{font-size:13px;color:var(--muted);margin-bottom:18px}
.seg{display:inline-flex;background:var(--ink);border:1.5px solid var(--border);border-radius:10px;padding:3px;gap:3px}
.seg label{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg label:hover{color:#fff}.seg label.on{background:var(--teal);color:#fff}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:12px}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:760px){.fgrid,.det-grid{grid-template-columns:1fr}.filtros input{min-width:0;width:100%}.main{padding:14px}.item-val{text-align:left}}
</style>
</head>

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseData(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function diasEntre(a,b){ return Math.round((parseData(b)-parseData(a))/86400000); }
function fmtData(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
function fmtDH(iso){ const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtBRL(v){ return (v==null||v==='')?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function parseBRL(s){ if(s==null) return null; s=String(s).trim().replace(/R\$\s?/,''); if(!s) return null; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); const n=parseFloat(s); return isNaN(n)?null:n; }
function moneyInput(v){ return v==null?'':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function novoId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function nomeUsuario(){
  // relê o perfil a cada uso: se o nome foi alterado no portal, vale na hora, mesmo com esta página já aberta
  try { const p = JSON.parse(localStorage.getItem('smct_perfil')||'{}'); if(p.email===perfil.email && p.nome) perfil.nome = p.nome; } catch(e){}
  return perfil.nome || perfil.email || 'Usuário';
}

// ═══════════════ MÁSCARA DE VALORES (R$ e quantidades) ═══════════════
// Enquanto digita: 37235 → 37.235 · 37235,5 → 37.235,5 · ao sair do campo (R$): 37.235,00
// O ponto é colocado sozinho; a vírgula separa os centavos (o ponto do teclado numérico vira vírgula).
function formatarNumeroBR(txt, maxDec){
  let s = String(txt||'').replace(/[^\d.,]/g,'');
  if(!s.includes(',') && /\.\d{1,2}$/.test(s) && (s.match(/\./g)||[]).length===1 && !/^\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\.(\d{1,2})$/, ',$1');
  s = s.replace(/\./g,'');
  const i = s.indexOf(',');
  let int = i>=0 ? s.slice(0,i) : s, dec = i>=0 ? s.slice(i+1).replace(/,/g,'').slice(0, maxDec) : null;
  int = int.replace(/^0+(?=\d)/,'');
  if(int==='' && dec!==null) int = '0';
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return dec!==null ? int+','+dec : int;
}
function aplicarMascara(el){
  const maxDec = el.classList.contains('money') ? 2 : (parseInt(el.dataset.dec)||2);
  const pos = el.selectionStart==null ? el.value.length : el.selectionStart;
  const antes = el.value.slice(0,pos).replace(/[^\d,]/g,'').length;   // dígitos e vírgula antes do cursor
  const novo = formatarNumeroBR(el.value, maxDec);
  if(novo===el.value) return;
  el.value = novo;
  let n=0, p=0; while(p<novo.length && n<antes){ if(/[\d,]/.test(novo[p])) n++; p++; }
  try { el.setSelectionRange(p,p); } catch(e){}
}
document.addEventListener('keydown', e=>{
  const el = e.target; if(!el.classList || !(el.classList.contains('money')||el.classList.contains('numero'))) return;
  if(e.key==='.' || e.key==='Decimal'){ e.preventDefault(); if(!el.value.includes(',')){ const p=el.selectionStart; el.value = el.value.slice(0,p)+','+el.value.slice(el.selectionEnd); el.setSelectionRange(p+1,p+1); aplicarMascara(el); } }
});
document.addEventListener('input', e=>{ const el=e.target; if(el.classList && (el.classList.contains('money')||el.classList.contains('numero'))) aplicarMascara(el); });
document.addEventListener('focusout', e=>{
  const el=e.target; if(!el.classList || !el.classList.contains('money') || !el.value.trim()) return;
  const n = parseBRL(el.value); if(n!=null) el.value = n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
});

// ═══════════════ SUPABASE ═══════════════
const H = () => ({ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' });
async function sbUpsert(chave, obj){
  const r = await fetch(SB_REST+'?on_conflict=chave', { method:'POST', headers:{...H(),'Prefer':'resolution=merge-duplicates'}, body:JSON.stringify([{chave, valor:JSON.stringify(obj)}]) });
  if(!r.ok) throw new Error('HTTP '+r.status);
}
async function sbGetChave(chave){
  const r = await fetch(SB_REST+'?chave=eq.'+encodeURIComponent(chave)+'&select=valor', { headers:H() });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows = await r.json(); return rows.length ? lerValor(rows[0].valor) : null;
}
async function carregarTudo(){
  const r = await fetch(SB_REST+'?chave=like.'+PREFIXO+'*&select=chave,valor', { headers:H() });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows = await r.json();
  processos = {};
  rows.forEach(row=>{ const p=lerValor(row.valor); if(p && p.id && !p.excluido) processos[p.id]=p; });
  try { const cfg = await sbGetChave(CHAVE_CFG); prazos = (cfg && cfg.prazos) || {}; } catch(e){ prazos = {}; }
  const rf = await fetch(SB_REST+'?chave=like.'+PX_FORN+'*&select=chave,valor', { headers:H() });
  if(!rf.ok) throw new Error('HTTP '+rf.status);
  fornecedores = {};
  (await rf.json()).forEach(row=>{ const f=lerValor(row.valor); if(f && f.id && !f.excluido) fornecedores[f.id]=f; });
}
async function salvarProcesso(p){
  if(!cloudOk){ alert('⚠ A conexão com o servidor falhou ao abrir esta página. Para proteger os dados, salvar está bloqueado. Recarregue a página (F5).'); throw new Error('bloqueado'); }
  p.atualizadoEm = new Date().toISOString(); p.atualizadoPor = nomeUsuario();
  sync('saving');
  try { await sbUpsert(PREFIXO+p.id, p); processos[p.id]=p; sync('saved'); }
  catch(e){ sync('error'); toast('⚠ Não foi possível salvar. Verifique a internet e tente de novo.', true); throw e; }
}
function ouvirTempoReal(){
  try {
    const cli = supabase.createClient(SB_URL, SB_KEY);
    cli.channel('processos-rt').on('postgres_changes', { event:'*', schema:'public', table:'app_data' }, payload=>{
      const row = payload.new; if(!row || !row.chave) return;
      if(row.chave.startsWith(PX_FORN)){ const f=lerValor(row.valor); if(f&&f.id){ if(f.excluido) delete fornecedores[f.id]; else fornecedores[f.id]=f; renderTudo(); } return; }
      if(!row.chave.startsWith(PREFIXO)) return;
      const p = lerValor(row.valor); if(!p || !p.id) return;
      if(p.excluido) delete processos[p.id]; else processos[p.id]=p;
      renderTudo(); if(detId===p.id) abrirDetalhe(p.id); sync('live');
    }).subscribe();
  } catch(e){ console.warn('realtime', e); }
}

// ═══════════════ SITUAÇÃO / PRAZOS ═══════════════
// Retorna {cls:'ok'|'atencao'|'atrasado'|'neutro'|'pago', txt, dias, atraso}
function situacao(p){
  if(p.cancelado) return {cls:'neutro', txt:'Cancelado', atraso:-999};
  if(p.etapa==='pago') return {cls:'pago', txt:'Pago em '+fmtData(p.dataPagamento), atraso:-999};
  const hoje = hojeISO();
  if(p.etapa==='execucao'){
    if(!p.dataPrevista) return {cls:'atencao', txt:'Sem data prevista', atraso:0};
    const falta = diasEntre(hoje, p.dataPrevista);
    if(falta<0) return {cls:'atrasado', txt:'Entrega vencida há '+(-falta)+'d', atraso:-falta};
    if(falta<=1) return {cls:'atencao', txt:falta===0?'Entrega prevista hoje':'Entrega amanhã', atraso:0};
    return {cls:'ok', txt:'Entrega em '+fmtData(p.dataPrevista), atraso:-falta};
  }
  const dias = Math.max(0, diasEntre(p.etapaDesde||hoje, hoje));
  const prazo = prazoDe(p.etapa);
  const txt = dias===0 ? 'Entrou hoje' : (dias===1?'Há 1 dia':'Há '+dias+' dias');
  if(prazo==null) return {cls:'ok', txt, dias, atraso:0};
  if(dias>prazo) return {cls:'atrasado', txt:txt+' · prazo '+prazo+'d', dias, atraso:dias-prazo};
  if(dias>=prazo) return {cls:'atencao', txt:txt+' · prazo '+prazo+'d', dias, atraso:0};
  return {cls:'ok', txt, dias, atraso:dias-prazo};
}
function ativos(){ return Object.values(processos).filter(p=>!p.cancelado && p.etapa!=='pago'); }

// ═══════════════ RENDER ═══════════════
function setTab(t){ tabAtual=t; ['hoje','quadro','lista','forn'].forEach(x=>$('tab-'+x).classList.toggle('active',x===t)); renderTudo(); }
function renderTudo(){
  const at = ativos();
  const atr = at.filter(p=>situacao(p).cls==='atrasado').length;
  const aPagar = at.filter(p=>IDX[p.etapa]>=IDX['execucao']).reduce((s,p)=>s+(Number(p.valorNF||p.valorEmpenho||p.valorEstimado)||0),0);
  $('pill-and').textContent = 'Em andamento: '+at.length;
  $('pill-atr').textContent = 'Atrasados: '+atr;
  $('pill-pag').textContent = 'A pagar: '+fmtBRL(aPagar);
  const nHoje = gruposHoje().reduce((s,g)=>s+(g.urgente?g.itens.length:0),0);
  $('cnt-hoje').textContent = nHoje; $('cnt-hoje').style.display = nHoje? '' : 'none';
  if(tabAtual==='hoje') renderHoje(); else if(tabAtual==='quadro') renderQuadro(); else if(tabAtual==='forn') renderFornecedores(); else renderLista();
}

function gruposHoje(){
  const at = ativos(); const hoje = hojeISO();
  const ord = arr => arr.sort((a,b)=>situacao(b).atraso-situacao(a).atraso);
  return [
    { ic:'🚨', tit:'Enviar a AF ao fornecedor', sub:'AF já emitida. Se não for enviada, o fornecedor não começa e o prazo corre.', critico:true, urgente:true, acao:'Marcar AF enviada',
      itens: ord(at.filter(p=>p.etapa==='af_emitida')) },
    { ic:'📎', tit:'Anexar a NF e enviar para pagamento', sub:'Nota já recebida. Anexe no GIAP e tramite para a Contabilidade.', critico:true, urgente:true, acao:'Marcar como enviada',
      itens: ord(at.filter(p=>p.etapa==='nf_recebida')) },
    { ic:'📦', tit:'Entrega ou serviço com data vencida', sub:'Confirme se foi realizado ou cobre o fornecedor.', urgente:true, acao:'Confirmar entrega',
      itens: ord(at.filter(p=>p.etapa==='execucao' && (!p.dataPrevista || p.dataPrevista<hoje))) },
    { ic:'🧾', tit:'Cobrar a nota fiscal do fornecedor', sub:'Serviço feito, mas a NF não chegou dentro do prazo.', urgente:true, acao:'Registrar NF', cobrar:true,
      itens: ord(at.filter(p=>p.etapa==='aguard_nf' && situacao(p).cls==='atrasado')) },
    { ic:'✍️', tit:'Aguardando assinatura do ordenador', sub:'Empenhos que precisam ser assinados.', urgente:false, acao:'Marcar assinado',
      itens: ord(at.filter(p=>p.etapa==='assinatura')) },
    { ic:'📍', tit:'Parados em outro setor', sub:'Processos fora da SMCT há mais de '+limiteFora()+' dias. Vale cobrar o setor onde estão.', urgente:false, acao:null, tramitar:true,
      itens: at.filter(p=>p.local && !ehSMCT(p.local) && diasNoLocal(p)>limiteFora()).sort((a,b)=>diasNoLocal(b)-diasNoLocal(a)) },
    { ic:'⏳', tit:'Parados além do prazo', sub:'Processos em outras etapas que passaram do tempo combinado.', urgente:true, acao:null,
      itens: ord(at.filter(p=>['aberto','compras_emp','compras_af','contabilidade'].includes(p.etapa) && situacao(p).cls==='atrasado')) }
  ];
}

function renderHoje(){
  const at = ativos(); const hoje = hojeISO(); const mes = hoje.slice(0,7);
  const pagosMes = Object.values(processos).filter(p=>p.etapa==='pago' && (p.dataPagamento||'').startsWith(mes));
  const fora = at.filter(p=>p.local && !ehSMCT(p.local));
  const porLocal = {}; at.forEach(p=>{ const k = p.local ? p.local.c+'|'+p.local.s : '_'; porLocal[k] = porLocal[k] || { u:p.local, n:0 }; porLocal[k].n++; });
  const grupos = gruposHoje();
  let h = `<div class="stat-row">
    <div class="sc teal"><div class="sc-lbl">Em andamento</div><div class="sc-val">${at.length}</div><div class="sc-sub">processos abertos</div></div>
    <div class="sc rose"><div class="sc-lbl">Atrasados</div><div class="sc-val">${at.filter(p=>situacao(p).cls==='atrasado').length}</div><div class="sc-sub">passaram do prazo da etapa</div></div>
    <div class="sc blue"><div class="sc-lbl">📍 Fora da SMCT</div><div class="sc-val">${fora.length}</div><div class="sc-sub">tramitando em outros setores</div></div>
    <div class="sc gold"><div class="sc-lbl">Pagos no mês</div><div class="sc-val">${pagosMes.length}</div><div class="sc-sub">${fmtBRL(pagosMes.reduce((s,p)=>s+(Number(p.valorNF)||0),0))}</div></div>
  </div>`;
  const comItens = grupos.filter(g=>g.itens.length);
  const locs = Object.values(porLocal).sort((a,b)=>b.n-a.n);
  if(at.length) h += `<div class="grupo" style="padding:12px 18px"><div style="font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">📍 Onde estão os processos em andamento</div><div style="display:flex;gap:8px;flex-wrap:wrap">${locs.map(x=>`<button class="btn btn-ghost btn-sm" title="${x.u?esc(x.u.c+' · '+x.u.d):''}" onclick="cons.local=${x.u?`'${esc(x.u.c)}|${esc(x.u.s)}'`:`'_'`};cons.status='andamento';setTab('lista')">${x.u?esc(x.u.s):'Local não informado'} <b style="color:${x.u&&!ehSMCT(x.u)?'#f0c060':'#4cd98a'}">${x.n}</b></button>`).join('')}</div></div>`;
  if(!at.length && Object.keys(processos).length){
    h += `<div class="tudo-ok">✅ Nenhum processo em andamento agora.<br><span style="font-size:12px;color:var(--muted)">Os processos concluídos e cancelados ficam guardados para consulta.</span><br><br><button class="btn btn-ghost" onclick="cons.status='todos';setTab('lista')">🗂 Consultar processos</button> ${podeEditar()?'<button class="btn btn-teal" onclick="abrirForm()">＋ Novo processo</button>':''}</div>`;
  } else if(!at.length){
    h += `<div class="tudo-ok">Nenhum processo cadastrado ainda.<br><br>${podeEditar()?'<button class="btn btn-teal" onclick="abrirForm()">＋ Cadastrar o primeiro processo</button>':''}</div>`;
  } else if(!comItens.length){
    h += `<div class="tudo-ok">✅ Tudo em dia. Nenhuma pendência para hoje.</div>`;
  }
  comItens.forEach(g=>{
    h += `<div class="grupo${g.critico?' critico':''}"><div class="grupo-hd"><span style="font-size:22px">${g.ic}</span><div><h3>${g.tit}</h3><p>${g.sub}</p></div><span class="n">${g.itens.length}</span></div>`;
    g.itens.forEach(p=>{ h += linhaItem(p, g.acao, g.cobrar, g.tramitar); });
    h += `</div>`;
  });
  $('main').innerHTML = h;
}
function linhaItem(p, acao, cobrar, tramitar){
  const s = situacao(p);
  let btn = (acao && podeEditar() && TRANS[p.etapa]) ? `<button class="btn btn-teal btn-sm" onclick="abrirTransicao('${p.id}')">${esc(acao)}</button>` : '';
  if(tramitar && podeEditar()) btn = `<button class="btn btn-gold btn-sm" onclick="abrirTramitar('${p.id}')">📍 Atualizar local</button>` + btn;
  if(cobrar && podeEditar()) btn = `<button class="btn btn-gold btn-sm" onclick="abrirMensagem('${p.id}','nf')">📲 Cobrar NF</button>` + btn;
  return `<div class="item">
    <div class="item-main" onclick="abrirDetalhe('${p.id}')">
      <div class="item-tit">Proc. ${esc(p.numProcesso)} · ${esc(p.objeto)}</div>
      <div class="item-sub">${esc(p.fornecedor||'Fornecedor não informado')}${p.numAF?' · AF '+esc(p.numAF):''}${p.numEmpenho?' · Empenho '+esc(p.numEmpenho):''} · ${rotuloLocal(p,true)}</div>
    </div>
    <span class="chip ${s.cls}">${esc(s.txt)}</span>
    <div class="item-val">${fmtBRL(p.valorNF||p.valorEmpenho||p.valorEstimado)}</div>
    ${btn}<button class="btn btn-ghost btn-sm" onclick="abrirDetalhe('${p.id}')">Abrir</button>
  </div>`;
}

function filtrados(){
  const q = filtro.q.trim().toLowerCase();
  return Object.values(processos).filter(p=>{
    if(!filtro.cancelados && p.cancelado) return false;
    if(filtro.tipo && p.tipo!==filtro.tipo) return false;
    if(filtro.etapa && p.etapa!==filtro.etapa) return false;
    if(filtro.sit && situacao(p).cls!==filtro.sit) return false;
    if(q){ const alvo=[p.numProcesso,p.objeto,p.fornecedor,p.numEmpenho,p.numAF,p.numNF,p.evento,p.responsavel].join(' ').toLowerCase(); if(!alvo.includes(q)) return false; }
    return true;
  });
}
function barraFiltros(comEtapa){
  return `<div class="filtros">
    <input id="f-q" placeholder="🔍 Buscar nº do processo, objeto, fornecedor, empenho, AF, NF..." value="${esc(filtro.q)}" oninput="filtro.q=this.value;atualizarFiltro()">
    <select onchange="filtro.tipo=this.value;renderTudo()"><option value="">Todos os tipos</option>${TIPOS.map(t=>`<option ${filtro.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
    ${comEtapa?`<select onchange="filtro.etapa=this.value;renderTudo()"><option value="">Todas as etapas</option>${ETAPAS.map(e=>`<option value="${e.id}" ${filtro.etapa===e.id?'selected':''}>${e.nome}</option>`).join('')}</select>`:''}
    <select onchange="filtro.sit=this.value;renderTudo()"><option value="">Qualquer situação</option><option value="atrasado" ${filtro.sit==='atrasado'?'selected':''}>Atrasados</option><option value="atencao" ${filtro.sit==='atencao'?'selected':''}>Atenção</option><option value="ok" ${filtro.sit==='ok'?'selected':''}>Em dia</option></select>
    <label><input type="checkbox" ${filtro.cancelados?'checked':''} onchange="filtro.cancelados=this.checked;renderTudo()"> Mostrar cancelados</label>
    ${!comEtapa?'':`<button class="btn btn-ghost btn-sm" onclick="exportarCSV()" style="margin-left:auto">⬇ Exportar planilha (CSV)</button>`}
  </div>`;
}
function atualizarFiltro(){ clearTimeout(window._ft); window._ft=setTimeout(()=>{ renderTudo(); const i=$('f-q'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },250); }

function renderQuadro(){
  const lista = filtrados(); const hoje = hojeISO();
  let h = barraFiltros(false);
  h += `<div class="legenda"><span><i style="background:var(--teal)"></i>Em dia</span><span><i style="background:var(--amber)"></i>No limite do prazo</span><span><i style="background:#e24b4a"></i>Atrasado</span><span style="margin-left:auto;color:var(--sub)">Pagos: mostrando só os últimos 30 dias</span></div>`;
  h += `<div class="board">`;
  ETAPAS.forEach(e=>{
    let itens = lista.filter(p=>p.etapa===e.id);
    if(e.id==='pago') itens = itens.filter(p=>!p.dataPagamento || diasEntre(p.dataPagamento, hoje)<=30);
    itens.sort((a,b)=>situacao(b).atraso-situacao(a).atraso);
    const pz = prazoDe(e.id);
    h += `<div class="col${e.critico?' critico':''}"><div class="col-hd"><div class="t"><span>${e.critico?'🚨 ':''}${esc(e.nome)}</span><span class="badge">${itens.length}</span></div>
      <div class="q">${esc(e.quem)}${pz!=null?' · prazo '+pz+' dia'+(pz>1?'s':''):''}</div></div><div class="col-body">`;
    if(!itens.length) h += `<div style="font-size:11px;color:#3a4a5a;text-align:center;padding:12px">—</div>`;
    itens.forEach(p=>{ const s=situacao(p);
      h += `<div class="card ${s.cls}" onclick="abrirDetalhe('${p.id}')">
        <div style="display:flex;justify-content:space-between;gap:6px"><span class="np">${esc(p.numProcesso)}</span><span class="badge">${esc(p.tipo)}</span></div>
        <div class="ob">${esc(p.objeto)}</div><div class="fo">${esc(p.fornecedor||'—')}</div><div class="fo" style="margin-top:3px">${rotuloLocal(p,true)}</div>
        <div class="ft"><span class="vl">${fmtBRL(p.valorNF||p.valorEmpenho||p.valorEstimado)}</span><span class="chip ${s.cls}">${esc(s.txt)}</span></div></div>`;
    });
    h += `</div></div>`;
  });
  h += `</div>`;
  $('main').innerHTML = h;
}

// ── Consultar processos: histórico completo, em lista ou em cards ──
let cons = { local:'', status:'todos', vis:(()=>{ try{ return localStorage.getItem('proc_vis')||'cards'; }catch(e){ return 'cards'; } })(), ano:'' };
function statusDe(p){ return p.cancelado ? 'cancelados' : p.etapa==='pago' ? 'concluidos' : 'andamento'; }
function consultaFiltrada(){
  const q = norm(filtro.q);
  return Object.values(processos).filter(p=>{
    if(cons.status!=='todos' && statusDe(p)!==cons.status) return false;
    if(cons.ano && String(p.dataAbertura||'').slice(0,4)!==cons.ano) return false;
    if(cons.local && (cons.local==='_' ? !!p.local : !p.local || (p.local.c+'|'+p.local.s)!==cons.local)) return false;
    if(filtro.tipo && p.tipo!==filtro.tipo) return false;
    if(q && !norm([p.numProcesso,p.objeto,p.fornecedor,p.numEmpenho,p.numAF,p.numNF,p.numSolicitacao,p.evento,p.responsavel].join(' ')).includes(q)) return false;
    return true;
  }).sort((a,b)=>(b.dataPagamento||b.atualizadoEm||b.dataAbertura||'').localeCompare(a.dataPagamento||a.atualizadoEm||a.dataAbertura||''));
}
function setVis(v){ cons.vis=v; try{ localStorage.setItem('proc_vis',v); }catch(e){} renderTudo(); }
function renderLista(){
  const todos = Object.values(processos);
  const cont = { todos:todos.length, andamento:0, concluidos:0, cancelados:0 }; todos.forEach(p=>cont[statusDe(p)]++);
  const anos = [...new Set(todos.map(p=>String(p.dataAbertura||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const lista = consultaFiltrada();
  const pill = (k,l) => `<button class="btn btn-sm ${cons.status===k?'btn-teal':'btn-ghost'}" onclick="cons.status='${k}';renderTudo()">${l} <span style="opacity:.75">${cont[k]}</span></button>`;
  let h = `<div class="filtros" style="justify-content:space-between">
      <div style="display:flex;gap:6px;flex-wrap:wrap">${pill('todos','Todos')}${pill('andamento','⏳ Em andamento')}${pill('concluidos','✅ Concluídos')}${pill('cancelados','✕ Cancelados')}</div>
      <div class="seg" style="width:auto;padding:3px"><label class="${cons.vis==='cards'?'on':''}" style="padding:6px 14px" onclick="setVis('cards')">▦ Cards</label><label class="${cons.vis==='lista'?'on':''}" style="padding:6px 14px" onclick="setVis('lista')">☰ Lista</label></div></div>
    <div class="filtros"><input id="f-q" placeholder="🔍 Buscar nº do processo, objeto, fornecedor, empenho, AF, NF, evento..." value="${esc(filtro.q)}" oninput="filtro.q=this.value;atualizarFiltro()">
      <select onchange="filtro.tipo=this.value;renderTudo()"><option value="">Todos os tipos</option>${TIPOS.map(t=>`<option ${filtro.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
      <select onchange="cons.ano=this.value;renderTudo()"><option value="">Todos os anos</option>${anos.map(a=>`<option ${cons.ano===a?'selected':''}>${a}</option>`).join('')}</select>
      ${cons.local?`<button class="btn btn-gold btn-sm" onclick="cons.local='';renderTudo()">📍 ${cons.local==='_'?'Local não informado':esc(cons.local.split('|')[1])} ✕</button>`:''}
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="exportarCSV()">⬇ Exportar planilha (CSV)</button></div>`;
  if(!lista.length){ h += `<div class="tudo-ok" style="background:var(--ink2);border-color:var(--border);color:var(--muted)">Nenhum processo encontrado com esses filtros.</div>`; $('main').innerHTML = h; return; }
  const valor = p => p.valorNF||p.valorEmpenho||p.valorEstimado;
  const selo = p => p.cancelado ? `<span class="chip neutro">✕ Cancelado</span>` : p.etapa==='pago' ? `<span class="chip pago">✅ Pago em ${fmtData(p.dataPagamento)}</span>` : `<span class="chip ${situacao(p).cls}">${esc(ETAPAS[IDX[p.etapa]].nome)}</span>`;
  if(cons.vis==='lista'){
    h += `<div class="tbl-wrap"><table><thead><tr><th>Processo</th><th>Tipo</th><th>Objeto</th><th>Fornecedor</th><th class="n">Valor</th><th>Situação</th><th>Onde está</th><th>Aberto em</th><th>AF · NF</th></tr></thead><tbody>`;
    lista.forEach(p=>{ h += `<tr class="click" onclick="abrirDetalhe('${p.id}')"><td style="font-weight:800;color:var(--gold);white-space:nowrap">${esc(p.numProcesso)}</td><td>${esc(p.tipo)}</td><td>${esc(p.objeto)}</td><td>${esc(p.fornecedor||'—')}</td>

function exportarCSV(){
  const cols = [['numProcesso','Processo'],['tipo','Tipo'],['objeto','Objeto'],['fornecedor','Fornecedor'],['evento','Evento'],['responsavel','Responsável'],['dataAbertura','Abertura'],['valorEstimado','Valor estimado'],['numEmpenho','Empenho'],['valorEmpenho','Valor empenho'],['numAF','AF'],['dataAF','Data AF'],['afEnviadaEm','AF enviada em'],['dataPrevista','Entrega prevista'],['dataEntrega','Entregue em'],['numNF','NF'],['valorNF','Valor NF'],['dataNF','NF recebida em'],['dataContabilidade','Enviado contabilidade'],['dataPagamento','Pago em']];
  const linhas = [cols.map(c=>c[1]).concat(['Etapa','Situação','Onde está (código)','Onde está (sigla)','Onde está (descrição)','Desde'])];
  (tabAtual==='lista'?consultaFiltrada():filtrados()).forEach(p=>{ linhas.push(cols.map(c=>{ const v=p[c[0]]; if(v==null) return ''; if(c[0].startsWith('valor')) return String(v).replace('.',','); if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtData(v); return v; }).concat([p.cancelado?'Cancelado':ETAPAS[IDX[p.etapa]].nome, situacao(p).txt, p.local?p.local.c:'', p.local?p.local.s:'', p.local?p.local.d:'', p.local?fmtData(p.local.desde):''])); });
  const csv = '﻿'+linhas.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download = 'processos_'+hojeISO()+'.csv'; a.click();
}

function inp(k, l, v, t, extra){
  extra = extra||{}; const req = extra.req?' <span class="req">*</span>':'';
  let ctl;
  if(t==='select') ctl = `<select id="ff-${k}">${extra.vazio?'<option value="">—</option>':''}${extra.op.map(o=>{ const val=typeof o==='object'?o.v:o, txt=typeof o==='object'?o.t:o; return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(txt)}</option>`; }).join('')}</select>`;
  else if(t==='textarea') ctl = `<textarea id="ff-${k}">${esc(v||'')}</textarea>`;
  else if(t==='money') ctl = `<input id="ff-${k}" class="money" inputmode="decimal" placeholder="0,00" value="${esc(moneyInput(v))}">`;
  else ctl = `<input id="ff-${k}" type="${t}" value="${esc(v||'')}" ${extra.ph?`placeholder="${esc(extra.ph)}"`:''}>`;
  return `<div class="fg${extra.full?' full':''}" id="fgw-${k}"><label>${l}${req}</label>${ctl}</div>`;
}

  $('form-box').innerHTML = h; abrir('ov-form'); iniciarListasUnid(); setTimeout(()=>{ const f=$('ff-numProcesso'); if(f) f.focus(); },50);
