async function salvarForm(id){
  const g = k => { const el=$('ff-'+k); return el ? el.value.trim() : undefined; };
  document.querySelectorAll('#form-box .fg').forEach(x=>x.classList.remove('erro'));
  const faltando = ['numProcesso','objeto','dataAbertura'].filter(k=>!g(k));
  if(faltando.length){ faltando.forEach(k=>$('fgw-'+k).classList.add('erro')); $('form-erro').textContent='Preencha os campos obrigatórios marcados em vermelho.'; $('form-erro').style.display='block'; return; }
  const num = g('numProcesso');
  const dup = Object.values(processos).find(x=>x.id!==id && !x.cancelado && x.numProcesso.replace(/\s/g,'')===num.replace(/\s/g,''));
  if(dup && !confirm('Já existe um processo com o nº '+num+' ('+dup.objeto+').\n\nCadastrar mesmo assim?')) return;
  const p = id ? JSON.parse(JSON.stringify(processos[id])) : { id:novoId(), criadoEm:new Date().toISOString(), criadoPor:nomeUsuario(), anexos:[], historico:[] };
  ['numProcesso','tipo','objeto','fornecedor','contato','dataAbertura','evento','responsavel','numSolicitacao','numEmpenho','dataAssinatura','numAF','dataAF','afEnviadaEm','dataPrevista','dataEntrega','numNF','dataNF','dataContabilidade','obs']
    .forEach(k=>{ const v=g(k); p[k] = v ? v : null; });
  ['valorEstimado','valorEmpenho','valorNF'].forEach(k=>{ p[k] = parseBRL(g(k)); });
  const fCad = p.fornecedor ? fornPorNome(p.fornecedor) : null; p.fornecedorId = fCad ? fCad.id : null; if(fCad) p.fornecedor = fCad.nome;
  if(!id){
    p.etapa = g('etapaInicial') || 'aberto';
    p.etapaDesde = p.etapa==='aberto' ? p.dataAbertura : hojeISO();
    const uI = _unidSel['form']; if(uI) registrarTramite(p, uI, p.etapaDesde, 'local inicial');
    p.historico.push({ em:new Date().toISOString(), por:nomeUsuario(), acao:'Processo cadastrado' + (p.etapa!=='aberto' ? ' já na etapa "'+ETAPAS[IDX[p.etapa]].nome+'"' : '') });
  } else {
    p.historico.push({ em:new Date().toISOString(), por:nomeUsuario(), acao:'Dados editados' });
  }
  $('btn-salvar-form').disabled = true;
  try { await salvarProcesso(p); fechar('ov-form'); toast(id?'✅ Processo atualizado':'✅ Processo cadastrado'); renderTudo(); if(id) abrirDetalhe(id); }
  catch(e){ $('btn-salvar-form').disabled = false; }
}

// ═══════════════ FORNECEDORES ═══════════════
function listaForn(){ return Object.values(fornecedores).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')); }
function fornPorNome(n){ const k=norm(n); return listaForn().find(f=>norm(f.nome)===k) || null; }
function fornDoProc(p){ return (p.fornecedorId && fornecedores[p.fornecedorId]) || (p.fornecedor ? fornPorNome(p.fornecedor) : null); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); }
function soDigitos(s){ return String(s||'').replace(/\D/g,''); }
function fmtFone(s){ const d=soDigitos(s).replace(/^55(?=\d{10,11}$)/,''); if(d.length===11) return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7); if(d.length===10) return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6); return s||''; }
function linkWhats(numero, texto){ let d=soDigitos(numero); if(d.length===10||d.length===11) d='55'+d; return 'https://wa.me/'+d+'?text='+encodeURIComponent(texto); }
function emailValido(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim()); }
function preencherContatoForn(nome){ const f=fornPorNome(nome); const c=$('ff-contato'); if(f && c && !c.value) c.value=[f.whatsapp?fmtFone(f.whatsapp):'', f.email||''].filter(Boolean).join(' · '); }

function renderFornecedores(){
  const q = norm(filtro.q); const lista = listaForn().filter(f=>!q || norm([f.nome,f.cnpj,f.email,f.contato].join(' ')).includes(q));
  const usoPorNome = {}; Object.values(processos).forEach(p=>{ const f=fornDoProc(p); if(f) usoPorNome[f.id]=(usoPorNome[f.id]||0)+1; });
  let h = `<div class="filtros"><input id="f-q" placeholder="🔍 Buscar fornecedor, CNPJ, e-mail..." value="${esc(filtro.q)}" oninput="filtro.q=this.value;atualizarFiltro()">
    ${podeEditar()?`<button class="btn btn-teal btn-sm" onclick="editarFornecedor()">＋ Novo fornecedor</button><button class="btn btn-ghost btn-sm" onclick="importarFornAtas()">⬇ Trazer fornecedores das atas</button>`:''}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Fornecedor</th><th>CNPJ</th><th>Contato</th><th>E-mail</th><th>WhatsApp</th><th>Processos</th><th></th></tr></thead><tbody>`;
  if(!lista.length) h += `<tr><td colspan="7" style="text-align:center;color:var(--sub);padding:24px">${listaForn().length?'Nenhum fornecedor encontrado.':'Nenhum fornecedor cadastrado ainda. Cadastre com e-mail e WhatsApp para enviar AF e cobrar NF com um clique.'}</td></tr>`;
  lista.forEach(f=>{ const falta = !f.email && !f.whatsapp;
    h += `<tr class="click" onclick="editarFornecedor('${f.id}')"><td style="font-weight:700">${esc(f.nome)}</td><td>${esc(f.cnpj||'—')}</td><td>${esc(f.contato||'—')}</td>
      <td>${f.email?esc(f.email):'<span style="color:#f0c060">falta</span>'}</td><td>${f.whatsapp?esc(fmtFone(f.whatsapp)):'<span style="color:#f0c060">falta</span>'}</td><td>${usoPorNome[f.id]||0}</td>
      <td>${falta?'<span class="chip atencao">Sem contato</span>':''}</td></tr>`; });
  h += `</tbody></table></div><div style="font-size:11px;color:var(--sub);margin-top:8px">${lista.length} fornecedor(es)</div>`;
  $('main').innerHTML = h;
}
function editarFornecedor(id){
  if(!podeEditar()) return;
  const f = id ? fornecedores[id] : {};
  $('form-box').innerHTML = `<div class="modal-tit">${id?'Editar fornecedor':'Novo fornecedor'}</div><div class="modal-sub">Com e-mail e WhatsApp cadastrados, a AF e a cobrança da NF saem com um clique.</div><div class="fgrid">
    ${inp('fNome','Razão social / nome',f.nome,'text',{req:true,full:true})}
    ${inp('fCnpj','CNPJ',f.cnpj,'text',{ph:'00.000.000/0000-00'})}${inp('fContato','Pessoa de contato',f.contato,'text')}
    ${inp('fEmail','E-mail',f.email,'email',{ph:'contato@empresa.com.br'})}${inp('fWhats','WhatsApp (com DDD)',f.whatsapp?fmtFone(f.whatsapp):'','text',{ph:'(16) 99999-9999'})}
    ${inp('fObs','Observações',f.obs,'textarea',{full:true})}</div><div class="msg-erro" id="form-erro"></div>
    <div class="mfooter" style="justify-content:space-between">${id&&isAdminP()?`<button class="btn btn-rose btn-sm" onclick="excluirFornecedor('${id}')">🗑 Excluir</button>`:'<span></span>'}<div style="display:flex;gap:10px"><button class="btn btn-ghost" onclick="fechar('ov-form')">Cancelar</button><button class="btn btn-teal" onclick="salvarFornecedor(${id?`'${id}'`:'null'})">Salvar</button></div></div>`;
  abrir('ov-form');
}
function isAdminP(){ return perfil.isAdmin===true; }
async function gravarFornecedor(f){
  if(!cloudOk){ alert('⚠ Salvar está bloqueado nesta sessão. Recarregue a página (F5).'); throw new Error('bloqueado'); }
  f.atualizadoEm = new Date().toISOString(); f.atualizadoPor = nomeUsuario();
  sync('saving');
  try { await sbUpsert(PX_FORN+f.id, f); fornecedores[f.id]=f; sync('saved'); } catch(e){ sync('error'); toast('⚠ Não foi possível salvar o fornecedor.', true); throw e; }
}
async function salvarFornecedor(id){
  const g = k => $('ff-'+k).value.trim();
  const erros = [];
  if(!g('fNome')) erros.push('Informe o nome do fornecedor.');
  if(g('fEmail') && !emailValido(g('fEmail'))) erros.push('O e-mail parece incompleto.');
  const w = soDigitos(g('fWhats')); if(w && !(w.length>=10 && w.length<=13)) erros.push('O WhatsApp precisa ter DDD e número.');
  const dup = fornPorNome(g('fNome')); if(dup && dup.id!==id) erros.push('Já existe um fornecedor com esse nome.');
  if(erros.length){ $('form-erro').innerHTML=erros.map(esc).join('<br>'); $('form-erro').style.display='block'; return; }
  const f = Object.assign({}, id?fornecedores[id]:{ id:novoId(), criadoEm:new Date().toISOString(), criadoPor:nomeUsuario() },
    { nome:g('fNome'), cnpj:g('fCnpj'), contato:g('fContato'), email:g('fEmail'), whatsapp:w, obs:g('fObs') });
  try { await gravarFornecedor(f); fechar('ov-form'); toast('✅ Fornecedor salvo'); renderTudo(); } catch(e){}
}
async function excluirFornecedor(id){
  const f = fornecedores[id]; if(!confirm('Excluir o fornecedor "'+f.nome+'" do cadastro?\n\nOs processos dele continuam com o nome.')) return;
  try { await gravarFornecedor({...f, excluido:true}); delete fornecedores[id]; fechar('ov-form'); toast('Fornecedor excluído'); renderTudo(); } catch(e){}
}
async function importarFornAtas(){
  let base; try { base = await sbGetChave('atas_base'); } catch(e){ toast('⚠ Não foi possível ler as atas', true); return; }
  if(!base || !base.atas){ toast('Nenhuma ata encontrada no Controle de Atas', true); return; }
  const nomes = [...new Set(base.atas.map(a=>(a.fornecedor||'').trim()).filter(Boolean))].filter(n=>!fornPorNome(n));
  if(!nomes.length){ toast('Todos os fornecedores das atas já estão cadastrados'); return; }
  if(!confirm('Cadastrar '+nomes.length+' fornecedor(es) das atas?\n\n'+nomes.join('\n')+'\n\nDepois, complete o e-mail e o WhatsApp de cada um.')) return;
  try { for(const n of nomes) await gravarFornecedor({ id:novoId(), nome:n, criadoEm:new Date().toISOString(), criadoPor:nomeUsuario(), origem:'atas' }); toast('✅ '+nomes.length+' fornecedor(es) cadastrado(s)'); renderTudo(); } catch(e){}
}

// ═══════════════ ENVIAR AF / COBRAR NF (WhatsApp e e-mail) ═══════════════
function anexoAF(p){ const a=(p.anexos||[]).filter(x=>x.cat==='AF'); return a.length ? a[a.length-1] : null; }
function linkDocumento(p, a){ return location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'') + 'documento.html?d=' + encodeURIComponent(p.id+'_'+a.id); }
function textoMensagem(tipo, p, link, dataPrevista){
  // assina quem é o responsável pelo processo; se o campo estiver vazio, assina quem está logado
  const assin = '\n\nAtenciosamente,\n'+((p.responsavel||'').trim() || nomeUsuario())+'\nSecretaria Municipal de Cultura e Turismo\nPrefeitura Municipal de São Carlos';
  const f = fornDoProc(p); const ola = 'Olá'+(f&&f.contato?', '+f.contato.split(' ')[0]:'')+'!';
  if(tipo==='af') return ola+'\n\nSegue a Autorização de Fornecimento (AF) nº '+(p.numAF||'')+', referente ao processo nº '+p.numProcesso+' ('+p.objeto+').'+
    (link?'\n\nPDF da AF: '+link:'')+(dataPrevista?'\n\nData prevista para a entrega / realização do serviço: '+fmtData(dataPrevista)+'.':'')+
    '\n\nApós a entrega ou a realização do serviço, envie a nota fiscal por este mesmo canal, informando o nº da AF.'+assin;
  return ola+'\n\nReferente à AF nº '+(p.numAF||'—')+' (processo nº '+p.numProcesso+' — '+p.objeto+')'+(p.dataEntrega?', com serviço/entrega realizado em '+fmtData(p.dataEntrega):'')+
    ', ainda não recebemos a nota fiscal.\n\nPor favor, envie a NF por este mesmo canal, informando o nº da AF, para darmos andamento ao pagamento.'+assin;
}
function abrirMensagem(id, tipo){
  if(!podeEditar()) return;
  const p = processos[id]; const f = fornDoProc(p); const af = anexoAF(p);
  const ehAF = tipo==='af'; const avanca = ehAF && p.etapa==='af_emitida';
  const temWhats = !!(f && f.whatsapp), temEmail = !!(f && f.email);
  let h = `<div class="modal-tit">${ehAF?(avanca?'📤 Enviar AF ao fornecedor':'📤 Reenviar AF'):'📲 Cobrar nota fiscal'}</div>
    <div class="modal-sub">Processo ${esc(p.numProcesso)} · ${esc(p.objeto)}<br>Fornecedor: <b style="color:#fff">${esc(p.fornecedor||'não informado')}</b>${f?'':' <span style="color:#f0c060">(sem cadastro)</span>'}</div>
    <div class="fgrid">
      <label class="check"><input type="checkbox" id="mg-usaW" ${temWhats||!temEmail?'checked':''}> WhatsApp</label>
      <label class="check"><input type="checkbox" id="mg-usaE" ${temEmail?'checked':''}> E-mail</label>
      ${inp('mgWhats','WhatsApp do fornecedor',f&&f.whatsapp?fmtFone(f.whatsapp):'','text',{ph:'(16) 99999-9999'})}
      ${inp('mgEmail','E-mail do fornecedor',f&&f.email||'','email',{ph:'contato@empresa.com.br'})}
      <label class="check full" style="font-size:12px"><input type="checkbox" id="mg-salvarForn" checked> Guardar este contato no cadastro do fornecedor</label>`;
  if(ehAF){
    if(avanca) h += `${inp('mgPrevista','Data prevista de entrega / realização do serviço',p.dataPrevista||'','date',{req:true,full:true})}`;
    h += af ? `<div class="full" style="font-size:12px;color:#4cd98a">📎 PDF da AF no processo: ${esc(af.nome)}</div>`
            : `<div class="fg full" id="w-mg-arqAF"><label>PDF da AF <span class="req">*</span></label><input type="file" id="mg-arqAF" accept=".pdf,image/*"><div style="font-size:11px;color:var(--sub);margin-top:4px">Baixe a AF do GIAP e escolha o arquivo aqui. Ele fica guardado no processo.</div></div>
               <label class="check full" style="font-size:12px"><input type="checkbox" id="mg-semPDF"> Enviar sem o PDF (vou mandar a AF de outro jeito)</label>`;
    h += `<label class="check full" style="font-size:12px"><input type="checkbox" id="mg-baixar" checked> Baixar o PDF da AF para eu arrastar para a conversa (o WhatsApp e o e-mail não aceitam anexar o arquivo sozinhos)</label>`;
  }
  h += `<div class="fg full"><label>Mensagem (pode editar)</label><textarea id="mg-texto" style="min-height:190px">${esc(textoMensagem(tipo, p, af?linkDocumento(p,af):'', p.dataPrevista))}</textarea></div></div>
    <div class="msg-erro" id="mg-erro"></div>
    <div style="font-size:11px;color:var(--sub);margin-top:10px">Ao clicar, o WhatsApp abre numa nova aba e o e-mail abre no seu programa de e-mail, com tudo preenchido. Confira e aperte enviar em cada um.${avanca?' O processo passa sozinho para "Aguardando entrega/serviço".':''}</div>
    <div class="mfooter"><button class="btn btn-ghost" onclick="fechar('ov-trans')">Cancelar</button><button class="btn btn-teal" id="btn-mg" onclick="enviarMensagem('${id}','${tipo}')">${ehAF?'📤 Enviar AF':'📲 Enviar cobrança'}</button></div>`;
  $('trans-box').innerHTML = h; abrir('ov-trans');
  const prev = $('ff-mgPrevista'); if(prev) prev.addEventListener('change', ()=>{ const t=$('mg-texto'); t.value = t.value.replace(/Data prevista para a entrega \/ realização do serviço: [^\n]*\n?/, '').replace(/\n\nApós a entrega/, (prev.value?'\n\nData prevista para a entrega / realização do serviço: '+fmtData(prev.value)+'.':'')+'\n\nApós a entrega'); });
}
async function baixarAnexoArquivo(pid, a, arqLocal){
  try {
    let blob, nome = a.nome;
    if(arqLocal){ blob = arqLocal; }
    else {
      const d = await sbGetChave(PREFIXO_ANX+pid+'_'+a.id); if(!d || !d.dados) throw new Error('vazio');
      const bin = atob(d.dados.split(',')[1]); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      blob = new Blob([arr], {type:d.tipo||'application/pdf'}); nome = d.nome || nome;
    }
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = nome; document.body.appendChild(link); link.click(); link.remove();
  } catch(e){ toast('⚠ Não consegui baixar o PDF da AF', true); }
}
async function enviarMensagem(id, tipo){
  const p0 = processos[id]; const ehAF = tipo==='af'; const avanca = ehAF && p0.etapa==='af_emitida';
  const usaW = $('mg-usaW').checked, usaE = $('mg-usaE').checked;
  const whats = soDigitos($('ff-mgWhats').value), email = $('ff-mgEmail').value.trim();
  const prevista = avanca ? $('ff-mgPrevista').value : null;
  let texto = $('mg-texto').value.trim();
  const erros = [];
  if(!usaW && !usaE) erros.push('Marque WhatsApp, e-mail ou os dois.');
  if(usaW && !(whats.length>=10 && whats.length<=13)) erros.push('Informe o WhatsApp com DDD.');
  if(usaE && !emailValido(email)) erros.push('Informe um e-mail válido.');
  if(avanca && !prevista) erros.push('Informe a data prevista de entrega / realização.');
  if(ehAF && !anexoAF(p0) && !($('mg-arqAF') && $('mg-arqAF').files[0]) && !($('mg-semPDF') && $('mg-semPDF').checked)) erros.push('Escolha o PDF da AF, ou marque "Enviar sem o PDF".');
  if(!texto) erros.push('A mensagem está vazia.');
  if(erros.length){ $('mg-erro').innerHTML=erros.map(esc).join('<br>'); $('mg-erro').style.display='block'; return; }
  const btn = $('btn-mg'); btn.disabled = true; btn.textContent = 'Preparando...';
  // abre a aba já no clique, para o navegador não bloquear como pop-up
  const aba = usaW ? window.open('', '_blank') : null;
  try {
    const p = JSON.parse(JSON.stringify(p0));
    const arq = $('mg-arqAF') && $('mg-arqAF').files[0];
    if(arq){
      const a = await guardarAnexo(p, arq, 'AF');
      const link = linkDocumento(p, a);
      texto = /PDF da AF: /.test(texto) ? texto : texto.replace(/(referente ao processo[^\n]*)/, '$1\n\nPDF da AF: '+link);
    }
    const meios = [usaW?'WhatsApp':null, usaE?'e-mail':null].filter(Boolean).join(' e ');
    if(usaW){ const url = linkWhats(whats, texto); if(aba) aba.location.href = url; else window.open(url, '_blank'); }
    if(usaE){
      const assunto = ehAF ? 'Autorização de Fornecimento nº '+(p.numAF||'')+' · Processo '+p.numProcesso+' · SMCT São Carlos' : 'Nota fiscal pendente · AF nº '+(p.numAF||'')+' · Processo '+p.numProcesso;
      setTimeout(()=>{ location.href = 'mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(assunto)+'&body='+encodeURIComponent(texto); }, usaW?600:0);
    }
    if($('mg-salvarForn').checked){
      const f0 = fornDoProc(p);
      const f = Object.assign({}, f0 || { id:novoId(), nome:p.fornecedor || 'Fornecedor do processo '+p.numProcesso, criadoEm:new Date().toISOString(), criadoPor:nomeUsuario() });
      let mudou = !f0; if(usaW && f.whatsapp!==whats){ f.whatsapp=whats; mudou=true; } if(usaE && f.email!==email){ f.email=email; mudou=true; }
      if(mudou) await gravarFornecedor(f);
      p.fornecedorId = f.id; if(!p.fornecedor) p.fornecedor = f.nome;
    }
    const agora = new Date().toISOString();
    if(avanca){
      Object.assign(p, { afEnviadaEm:hojeISO(), afEnviadaMeio:meios, dataPrevista:prevista, etapa:'execucao', etapaDesde:hojeISO() });
      p.historico = (p.historico||[]).concat([{ em:agora, por:nomeUsuario(), acao:'AF enviada ao fornecedor por '+meios+' → Aguardando entrega/serviço', obs:'Entrega prevista: '+fmtData(prevista) }]);
    } else {
      p.historico = (p.historico||[]).concat([{ em:agora, por:nomeUsuario(), acao:(ehAF?'AF reenviada':'NF cobrada do fornecedor')+' por '+meios }]);
      if(!ehAF) p.ultimaCobrancaNF = agora;
    }
    await salvarProcesso(p);
    renderTudo(); if(detId===id) abrirDetalhe(id);
    const afFinal = ehAF ? anexoAF(p) : null;
    if(afFinal && $('mg-baixar') && $('mg-baixar').checked){
      await baixarAnexoArquivo(p.id, afFinal, arq);
      $('trans-box').innerHTML = `<div class="modal-tit">✅ ${avanca?'AF enviada e processo atualizado':'AF reenviada'}</div>
        <div class="modal-sub">O PDF da AF foi baixado no seu computador: <b style="color:#fff">${esc(afFinal.nome)}</b></div>
        <div style="font-size:13px;line-height:1.7;color:var(--text)">Para mandar o arquivo junto:<br>
        ${usaW?'• <b>WhatsApp:</b> arraste o PDF da barra de downloads do navegador para a conversa que abriu e aperte enviar.<br>':''}
        ${usaE?'• <b>E-mail:</b> arraste o mesmo PDF para a mensagem antes de enviar.<br>':''}
        <span style="color:var(--sub);font-size:12px">A mensagem também leva o link para o fornecedor baixar a AF, caso o arquivo não vá.</span></div>
        <div class="mfooter"><button class="btn btn-ghost" onclick="baixarAnexoArquivo('${p.id}', anexoAF(processos['${p.id}']))">⬇ Baixar de novo</button><button class="btn btn-teal" onclick="fechar('ov-trans')">Fechar</button></div>`;
    } else {
      fechar('ov-trans'); toast(ehAF?(avanca?'📤 AF enviada · processo avançou':'📤 AF reenviada'):'📲 Cobrança registrada');
    }
  } catch(e){
    if(aba) aba.close();
    if(e.message && !e.message.startsWith('HTTP') && e.message!=='bloqueado') alert(e.message);
    btn.disabled=false; btn.textContent = ehAF?'📤 Enviar AF':'📲 Enviar cobrança';
  }
}

// ═══════════════ ONDE ESTÁ O PROCESSO (unidades do GIAP) ═══════════════
// p.local = {c: código, s: sigla, d: descrição, desde: 'AAAA-MM-DD'} · p.tramitacoes = [{c,s,d,em,por,obs}]
const UNID_SMCT_FIN = UNIDADES_GIAP.find(u=>u[0]==='2.7.2.3.1') || ['2.7.2.3.1','SMCT-FINANCEIRO','SECRETARIA MUNICIPAL DE CULTURA E TURISMO - FINANCEIRO'];
// sugestões do caminho mais comum; a última escolha feita em cada etapa passa a ser a sugestão daquela etapa
const SUGESTAO_TRAMITE = { aberto:'2.20.5.2', compras_emp:'2.7.2.3.1', assinatura:'2.20.5.2', compras_af:'2.7.2.3.1', nf_recebida:'2.14.2.4' };
function unidPorCod(c){ return UNIDADES_GIAP.find(u=>u[0]===c) || null; }
function ehSMCT(l){ return !!(l && String(l.c).startsWith('2.7')); }
function diasNoLocal(p){ return p.local && p.local.desde ? Math.max(0, diasEntre(p.local.desde, hojeISO())) : null; }
function limiteFora(){ return prazos.foraSMCT!=null ? prazos.foraSMCT : 10; }
function rotuloLocal(p, curto){
  if(!p.local) return '<span style="color:#3a4a5a">📍 local não informado</span>';
  const d = diasNoLocal(p); const fora = !ehSMCT(p.local) && d!=null && d>limiteFora() && !p.cancelado && p.etapa!=='pago';
  return `<span title="${esc(p.local.c+' · '+p.local.s+' · '+p.local.d)}" style="color:${fora?'#f0c060':'var(--muted)'}">📍 ${esc(p.local.s||p.local.d)}${curto?'':' · '+esc(p.local.d)}${d!=null?' · '+(d===0?'hoje':'há '+d+'d'):''}</span>`;
}
function sugestaoTramite(etapa){
  try { const m = JSON.parse(localStorage.getItem('proc_tramite_sug')||'{}'); if(m[etapa]) return m[etapa]; } catch(e){}
  const u = unidPorCod(SUGESTAO_TRAMITE[etapa]); return u ? { c:u[0], s:u[1], d:u[2] } : null;
}
function lembrarTramite(etapa, u){ try { const m = JSON.parse(localStorage.getItem('proc_tramite_sug')||'{}'); m[etapa] = u; localStorage.setItem('proc_tramite_sug', JSON.stringify(m)); } catch(e){} }
function maisUsadas(){
  const cont = {}; Object.values(processos).forEach(p=>(p.tramitacoes||[]).forEach(t=>{ const k=t.c+'|'+t.s; cont[k]=cont[k]||{u:{c:t.c,s:t.s,d:t.d},n:0}; cont[k].n++; }));
  const lista = Object.values(cont).sort((a,b)=>b.n-a.n).slice(0,8).map(x=>x.u);
  if(!lista.some(u=>u.c===UNID_SMCT_FIN[0])) lista.push({ c:UNID_SMCT_FIN[0], s:UNID_SMCT_FIN[1], d:UNID_SMCT_FIN[2] });
  return lista;
}
// Campo de escolha de unidade com busca: código · sigla · descrição
const _unidSel = {};
function campoUnidade(key, atual, rotulo, req){
  _unidSel[key] = atual || null;
  return `<div class="fg full"><label>${rotulo}${req?' <span class="req">*</span>':''}</label>
    <div id="us-${key}-sel" style="margin-bottom:6px">${htmlUnidSel(key)}</div>
    <input id="us-${key}-q" placeholder="🔍 Buscar por código, sigla ou nome do setor (ex.: compras, contabilidade, 2.20.5)" oninput="filtrarUnid('${key}')" autocomplete="off">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${maisUsadas().map(u=>`<button type="button" class="btn btn-ghost btn-sm" title="${esc(u.c+' · '+u.d)}" onclick="escolherUnid('${key}','${esc(u.c)}','${esc(u.s)}')">${esc(u.s||u.d)}</button>`).join('')}</div>
    <div id="us-${key}-res" style="max-height:230px;overflow-y:auto;margin-top:6px;border-radius:8px;border:1px solid var(--border)"></div></div>`;
}
function htmlUnidSel(key){
  const u = _unidSel[key];
  if(!u) return `<span style="font-size:12px;color:var(--sub)">Nenhum setor escolhido</span>`;
  return `<div style="display:flex;align-items:center;gap:10px;background:var(--teal-l);border:1px solid var(--teal-m);border-radius:9px;padding:8px 12px">
    <span style="font-family:monospace;color:#4cd98a;font-size:12px">${esc(u.c)}</span><b style="color:#fff;font-size:12px">${esc(u.s)}</b><span style="font-size:12px;color:var(--text);flex:1">${esc(u.d)}</span>
    <button type="button" class="btn btn-ghost btn-sm" onclick="_unidSel['${key}']=null;$('us-${key}-sel').innerHTML=htmlUnidSel('${key}')">✕</button></div>`;
}
function filtrarUnid(key){
  const q = norm($('us-'+key+'-q').value); const box = $('us-'+key+'-res');
  const termos = q ? q.split(' ') : [];
  const achados = UNIDADES_GIAP.filter(u=>{ if(!termos.length) return true; const alvo = norm(u.join(' ')); return termos.every(t=>alvo.includes(t)); });
  const td = 'padding:6px 10px;font-size:12px;vertical-align:top';
  box.innerHTML = achados.length ? `<table style="width:100%;table-layout:fixed"><colgroup><col style="width:100px"><col style="width:190px"><col></colgroup><thead><tr><th style="position:sticky;top:0">Código</th><th style="position:sticky;top:0">Sigla</th><th style="position:sticky;top:0">Descrição</th></tr></thead><tbody>${achados.map(u=>`<tr class="click" onclick="escolherUnid('${key}','${esc(u[0])}','${esc(u[1])}')"><td style="${td};font-family:monospace">${esc(u[0])}</td><td style="${td};font-weight:700;word-break:break-word">${esc(u[1])}</td><td style="${td}">${esc(u[2])}</td></tr>`).join('')}</tbody></table>${!termos.length?`<div style="font-size:11px;color:var(--sub);padding:6px 10px">${UNIDADES_GIAP.length} setores do GIAP · digite acima para filtrar</div>`:''}`
    : `<div style="font-size:12px;color:var(--sub);padding:8px">Nenhum setor encontrado.</div>`;
}
// mostra a lista completa assim que o campo aparece na tela
function iniciarListasUnid(){ Object.keys(_unidSel).forEach(k=>{ if($('us-'+k+'-res') && !$('us-'+k+'-res').innerHTML) filtrarUnid(k); }); }
function escolherUnid(key, c, s){
  const u = UNIDADES_GIAP.find(x=>x[0]===c && x[1]===s) || unidPorCod(c); if(!u) return;
  _unidSel[key] = { c:u[0], s:u[1], d:u[2] };
  $('us-'+key+'-sel').innerHTML = htmlUnidSel(key); $('us-'+key+'-q').value=''; filtrarUnid(key);
}
function registrarTramite(p, u, data, obs){
  p.local = { c:u.c, s:u.s, d:u.d, desde:data||hojeISO() };
  p.tramitacoes = (p.tramitacoes||[]).concat([{ c:u.c, s:u.s, d:u.d, em:data||hojeISO(), por:nomeUsuario(), registradoEm:new Date().toISOString(), obs:obs||'' }]);
}
function abrirTramitar(id){
  if(!podeEditar()) return;
  const p = processos[id];
  $('trans-box').innerHTML = `<div class="modal-tit">📍 Tramitei para…</div><div class="modal-sub">Processo ${esc(p.numProcesso)} · ${esc(p.objeto)}<br>Agora está em: ${p.local?esc(p.local.s+' — '+p.local.d):'não informado'}</div>
    <div class="fgrid">${campoUnidade('tram', null, 'Setor de destino no GIAP', true)}
    <div class="fg"><label>Data da tramitação</label><input type="date" id="tr-data" value="${hojeISO()}"></div>
    <div class="fg"><label>Observação</label><input id="tr-obs2" placeholder="ex.: para parecer"></div></div>
    <div class="msg-erro" id="tr-erro2"></div>
    <div class="mfooter"><button class="btn btn-ghost" onclick="fechar('ov-trans')">Cancelar</button><button class="btn btn-teal" id="btn-tram" onclick="salvarTramitar('${id}')">📍 Registrar tramitação</button></div>`;
  abrir('ov-trans'); iniciarListasUnid(); setTimeout(()=>{ const q=$('us-tram-q'); if(q) q.focus(); },50);
}
async function salvarTramitar(id){
  const u = _unidSel['tram']; if(!u){ $('tr-erro2').textContent='Escolha o setor para onde o processo foi.'; $('tr-erro2').style.display='block'; return; }
  const data = $('tr-data').value || hojeISO(); const obs = $('tr-obs2').value.trim();
  const p = JSON.parse(JSON.stringify(processos[id]));
  registrarTramite(p, u, data, obs);
  p.historico = (p.historico||[]).concat([{ em:new Date().toISOString(), por:nomeUsuario(), acao:'📍 Tramitado para '+u.s+' — '+u.d, obs:(data!==hojeISO()?'em '+fmtData(data)+(obs?' · ':''):'')+obs }]);
  $('btn-tram').disabled = true;
  try { await salvarProcesso(p); fechar('ov-trans'); toast('📍 Tramitado para '+u.s); renderTudo(); if(detId===id) abrirDetalhe(id); } catch(e){ $('btn-tram').disabled=false; }
}

// ═══════════════ ENVIAR DOCUMENTOS (leitura automática por IA) ═══════════════
// O usuário solta AF, empenho, NF ou solicitação baixados do GIAP. A IA lê, o sistema acha o processo,
// mostra o que vai fazer e, depois da conferência, anexa, preenche os campos e avança a etapa.
const IA_MODELO = 'claude-sonnet-4-6';
const TIPOS_DOC = ['AF','Empenho','Nota fiscal','Solicitação','Outro'];
let docsFila = [];   // {id, file, status:'lendo'|'conferir'|'aplicado'|'erro'|'ignorado', dados, procId, msg, assinado}
let docProcFixo = null;

function chaveIA(){ return (localStorage.getItem('anthropic_api_key')||'').trim(); }
function chaveNum(s){
  if(!s) return '';
  const m = String(s).match(/(\d+)\s*[\/\-.]\s*(\d{2,4})\b/);
  if(m){ const ano = m[2].length===2 ? '20'+m[2] : m[2]; return parseInt(m[1],10)+'/'+ano; }
  const d = String(s).replace(/\D/g,''); return d ? String(parseInt(d,10)) : '';
}
function abrirEnvioDocs(procId){
  if(!podeEditar()){ alert('Seu perfil é somente leitura.'); return; }
  docProcFixo = procId || null;
  docsFila = docsFila.filter(d=>d.status==='lendo' || d.status==='conferir');
  renderEnvioDocs(); abrir('ov-docs');
}
function renderEnvioDocs(){
  const temChave = chaveIA().length>20;
  const pFixo = docProcFixo && processos[docProcFixo];
  let h = `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="modal-tit">📥 Enviar documentos</div>
    <div class="modal-sub" style="margin-bottom:12px">${pFixo?'Para o processo <b style="color:#fff">'+esc(pFixo.numProcesso)+'</b>. ':''}Solte aqui a AF, o empenho, a nota fiscal ou a solicitação, em PDF ou foto. O sistema lê o documento, encontra o processo, preenche os campos e avança a etapa. Você confere antes de aplicar.</div></div>
    <button class="btn btn-ghost btn-sm" onclick="fechar('ov-docs')">✕</button></div>`;
  if(!temChave){
    h += `<div class="aviso" style="margin:0 0 12px">🔑 Para a leitura automática, informe a chave da IA (a mesma usada no Gerenciador e nas Emendas). Sem ela, você ainda pode enviar o documento e preencher os campos à mão.
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input id="ia-chave" type="password" placeholder="sk-ant-..." style="flex:1;min-width:220px;background:var(--ink);border:1px solid var(--border);border-radius:8px;color:#fff;padding:7px 10px">
      <button class="btn btn-teal btn-sm" onclick="localStorage.setItem('anthropic_api_key',$('ia-chave').value.trim());renderEnvioDocs()">Salvar chave</button>
      <a href="https://console.anthropic.com/settings/keys" target="_blank" style="font-size:11px;color:var(--gold);align-self:center">Obter chave →</a></div></div>`;
  }
  h += `<label id="docs-drop" style="display:block;border:2px dashed #3a5a70;border-radius:14px;padding:26px;text-align:center;cursor:pointer;background:var(--ink);transition:.15s"
      ondragover="event.preventDefault();this.style.borderColor='#4cd98a'" ondragleave="this.style.borderColor='#3a5a70'" ondrop="event.preventDefault();this.style.borderColor='#3a5a70';receberDocs(event.dataTransfer.files)">
      <div style="font-size:30px">📄</div><div style="font-size:14px;font-weight:700;color:#fff;margin-top:6px">Arraste os arquivos para cá ou clique para escolher</div>
      <div style="font-size:11px;color:var(--sub);margin-top:4px">PDF ou imagem · pode mandar vários de uma vez</div>
      <input type="file" multiple accept=".pdf,image/*" style="display:none" onchange="receberDocs(this.files);this.value=''"></label>`;
  if(docsFila.length) h += `<div style="margin-top:14px;display:flex;flex-direction:column;gap:12px">${docsFila.map(cardDoc).join('')}</div>`;
  $('docs-box').innerHTML = h;
}
function receberDocs(files){
  [...files].forEach(f=>{
    if(f.size > LIMITE_ARQ_MB*1024*1024){ toast('"'+f.name+'" tem mais de '+LIMITE_ARQ_MB+' MB', true); return; }
    const d = { id:novoId(), file:f, status: chaveIA().length>20 ? 'lendo' : 'conferir', dados:{ tipo:palpiteTipo(f.name) }, procId:docProcFixo, msg:'' };
    docsFila.push(d);
    if(d.status==='lendo') lerDocumento(d); else localizarProcesso(d);
  });
  renderEnvioDocs();
}
function palpiteTipo(nome){ const n=norm(nome); if(/\baf\b|autoriza/.test(n)) return 'AF'; if(/empenho|\bne\b/.test(n)) return 'Empenho'; if(/\bnf|nota|danfe|nfs/.test(n)) return 'Nota fiscal'; if(/solicit|sc\b/.test(n)) return 'Solicitação'; return 'Outro'; }

async function lerDocumento(d){
  try {
    const b64 = (await lerArquivo(d.file)).split(',')[1];
    const ehPdf = d.file.type==='application/pdf' || /\.pdf$/i.test(d.file.name);
    const bloco = ehPdf ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data:b64 } }
                        : { type:'image', source:{ type:'base64', media_type:d.file.type||'image/jpeg', data:b64 } };
    const prompt = `Você lê documentos de compras públicas da Prefeitura Municipal de São Carlos (SP), baixados do sistema GIAP ou enviados por fornecedores.
Identifique o tipo e extraia os dados. Responda SOMENTE com um JSON válido, sem texto antes ou depois, neste formato:
{"tipo":"AF"|"Empenho"|"Nota fiscal"|"Solicitação"|"Outro",
 "numProcesso":"número do processo administrativo, ex. 8521/2026, ou null",
 "numSolicitacao":"nº da solicitação de compra ou null",
 "numEmpenho":"nº da nota de empenho ou null","valorEmpenho":número ou null,"dataEmpenho":"AAAA-MM-DD ou null",
 "numAF":"nº da autorização de fornecimento ou null","dataAF":"AAAA-MM-DD ou null",
 "numNF":"nº da nota fiscal ou null","valorNF":número ou null,"dataEmissaoNF":"AAAA-MM-DD ou null",
 "fornecedor":"razão social do fornecedor/credor ou null","cnpj":"CNPJ do fornecedor ou null",
 "objeto":"descrição curta do que foi contratado, até 90 caracteres, ou null",
 "valorTotal":número ou null,
 "duvidas":"o que ficou ilegível ou incerto, ou null"}
Regras: AF = Autorização de Fornecimento. Empenho = Nota de Empenho. Na nota fiscal, procure o nº do processo, da AF e do empenho nas informações complementares. Valores em número com ponto decimal (ex. 1800.5). Não invente: se não encontrar, use null. Números de documento no formato que aparecem (ex. 115/2026).`;
    const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-api-key':chaveIA(), 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:IA_MODELO, max_tokens:1200, messages:[{ role:'user', content:[ bloco, { type:'text', text:prompt } ] }] }) });
    const j = await r.json();
    if(!r.ok) throw new Error(r.status===401 ? 'A chave da IA não foi aceita. Confira a chave.' : ((j.error&&j.error.message)||('Erro '+r.status)));
    const txt = (j.content||[]).map(c=>c.text||'').join('');
    const ini = txt.indexOf('{'), fim = txt.lastIndexOf('}');
    if(ini<0||fim<0) throw new Error('A IA não devolveu os dados no formato esperado.');
    const dados = JSON.parse(txt.slice(ini, fim+1));
    if(!TIPOS_DOC.includes(dados.tipo)) dados.tipo = 'Outro';
    d.dados = dados; d.status = 'conferir';
  } catch(e){
    d.status = 'conferir'; d.msg = '⚠ Não consegui ler o documento automaticamente ('+e.message+'). Preencha os campos abaixo.';
  }
  localizarProcesso(d);
  if($('ov-docs').classList.contains('open')) renderEnvioDocs();
}
function localizarProcesso(d){
  d.sugestao = false; d.duvida = '';
  if(docProcFixo){ d.procId = docProcFixo; d.achadoPor = 'escolhido'; return; }
  const x = d.dados; const lista = Object.values(processos).filter(p=>!p.cancelado);
  const regras = [['numProcesso','numProcesso','nº do processo'],['numAF','numAF','nº da AF'],['numEmpenho','numEmpenho','nº do empenho'],['numSolicitacao','numSolicitacao','nº da solicitação']];
  for(const [kDoc,kProc,rotulo] of regras){
    const alvo = chaveNum(x[kDoc]); if(!alvo) continue;
    const achados = lista.filter(p=>chaveNum(p[kProc])===alvo);
    if(achados.length===1){ d.procId = achados[0].id; d.achadoPor = rotulo; return; }
    if(achados.length>1){ d.procId = ''; d.achadoPor = ''; d.duvida = 'Mais de um processo tem o mesmo '+rotulo+'. Escolha o certo.'; return; }
  }
  // sem número que bata: sugere pelo fornecedor, se só um processo em andamento for dele
  if(x.fornecedor){
    const k = norm(x.fornecedor).slice(0,12);
    const pelos = lista.filter(p=>p.etapa!=='pago' && p.fornecedor && norm(p.fornecedor).slice(0,12)===k);
    if(pelos.length===1){ d.procId = pelos[0].id; d.achadoPor = 'fornecedor'; d.sugestao = true; return; }
  }
  d.procId = ''; d.achadoPor = '';
  d.duvida = x.numProcesso ? 'Não encontrei o processo '+x.numProcesso+' no acompanhamento. Escolha um processo ou crie um novo.' : 'O documento não informa o nº do processo. Escolha o processo correto.';
}
function etapaAlvo(tipo, assinado){
  return { 'Empenho': assinado?'compras_af':'assinatura', 'AF':'af_emitida', 'Nota fiscal':'nf_recebida', 'Solicitação':'aberto' }[tipo] || null;
}
const CAMPOS_DOC = {
  'AF':          [['numAF','Nº da AF','text'],['dataAF','Data da AF','date'],['numEmpenho','Nº do empenho','text'],['valorEmpenho','Valor (R$)','money']],
  'Empenho':     [['numEmpenho','Nº do empenho','text'],['valorEmpenho','Valor empenhado (R$)','money'],['dataEmpenho','Data do empenho','date']],
  'Nota fiscal': [['numNF','Nº da NF','text'],['valorNF','Valor da NF (R$)','money'],['dataEmissaoNF','Emissão','date'],['numAF','Nº da AF citada','text']],
  'Solicitação': [['numSolicitacao','Nº da solicitação','text'],['valorTotal','Valor estimado (R$)','money']],
  'Outro':       []
};
function cardDoc(d){
  const x = d.dados || {};
  if(d.status==='lendo') return `<div class="grupo" style="margin:0;padding:14px 16px"><b style="color:#fff">⏳ Lendo ${esc(d.file.name)}...</b><div style="font-size:11px;color:var(--sub);margin-top:3px">Leva alguns segundos.</div></div>`;
  if(d.status==='aplicado') return `<div class="grupo" style="margin:0;padding:12px 16px;border-color:var(--teal-m);background:var(--teal-l)"><b style="color:#4cd98a">✅ ${esc(d.file.name)}</b><div style="font-size:12px;color:var(--text);margin-top:3px">${d.msg}</div></div>`;
  if(d.status==='ignorado') return `<div class="grupo" style="margin:0;padding:10px 16px;opacity:.6"><span style="color:var(--muted);font-size:12px">${esc(d.file.name)} · ignorado</span></div>`;
  const ativos = Object.values(processos).filter(p=>!p.cancelado && p.etapa!=='pago').sort((a,b)=>String(a.numProcesso).localeCompare(String(b.numProcesso),'pt-BR',{numeric:true}));
  const p = d.procId && d.procId!=='novo' ? processos[d.procId] : null;
  const alvo = etapaAlvo(x.tipo, d.assinado);
  let efeito = '';
  if(p){ efeito = alvo && IDX[alvo] > IDX[p.etapa] ? `O processo vai de <b>${esc(ETAPAS[IDX[p.etapa]].nome)}</b> para <b style="color:#4cd98a">${esc(ETAPAS[IDX[alvo]].nome)}</b>.` : `O documento será anexado e os campos atualizados. A etapa continua <b>${esc(ETAPAS[IDX[p.etapa]].nome)}</b>.`; }
  else if(d.procId==='novo') efeito = `Será criado um processo novo${alvo&&alvo!=='aberto'?', já na etapa <b style="color:#4cd98a">'+esc(ETAPAS[IDX[alvo]].nome)+'</b>':''}.`;
  let aviso = '';
  const vNF = parseBRL(x.valorNF), vEmp = p ? (parseBRL(x.valorEmpenho) ?? p.valorEmpenho) : parseBRL(x.valorEmpenho);
  if(x.tipo==='Nota fiscal' && vNF!=null && vEmp!=null && Math.abs(vNF-vEmp)>0.009) aviso = `⚠ O valor da NF (${fmtBRL(vNF)}) é diferente do empenho (${fmtBRL(vEmp)}).`;
  if(p && x.fornecedor && p.fornecedor && norm(x.fornecedor).slice(0,12)!==norm(p.fornecedor).slice(0,12)) aviso += (aviso?'<br>':'')+`⚠ O fornecedor do documento (${esc(x.fornecedor)}) parece diferente do processo (${esc(p.fornecedor)}).`;
  const campo = (k,l,t) => { let v = x[k]; if(t==='money') v = v!=null&&v!==''?moneyInput(parseBRL(v)):''; return `<div class="fg"><label>${esc(l)}</label><input data-doc="${d.id}" data-k="${k}" data-t="${t}" type="${t==='money'?'text':t}" ${t==='money'?'class="money" inputmode="decimal"':''} value="${esc(v==null?'':v)}" onchange="lerCamposDoc('${d.id}')"></div>`; };
  return `<div class="grupo" style="margin:0;padding:16px 18px;${d.duvida&&!d.procId?'border-color:#6b4a10':''}">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><b style="color:#fff;word-break:break-all">📄 ${esc(d.file.name)}</b>
      ${d.achadoPor&&d.achadoPor!=='escolhido'?(d.sugestao?`<span class="chip atencao">❓ Sugestão pelo fornecedor: confira o processo</span>`:`<span class="chip ok">✓ Encontrei pelo ${esc(d.achadoPor)}</span>`):''}</div>
    ${d.msg?`<div class="aviso" style="margin:0 0 10px">${esc(d.msg)}</div>`:''}
    ${x.duvidas?`<div style="font-size:11px;color:#f0c060;margin-bottom:8px">A leitura teve dúvidas: ${esc(x.duvidas)}</div>`:''}
    <div class="fgrid">
      <div class="fg"><label>Tipo de documento</label><select onchange="docsFila.find(q=>q.id==='${d.id}').dados.tipo=this.value;renderEnvioDocs()">${TIPOS_DOC.map(t=>`<option ${x.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="fg"><label>Processo ${d.duvida&&!d.procId?'<span class="req">— escolha</span>':''}</label><select onchange="escolherProcDoc('${d.id}',this.value)">
        <option value="">Escolha o processo...</option>${ativos.map(q=>`<option value="${q.id}" ${d.procId===q.id?'selected':''}>${esc(q.numProcesso)} · ${esc(String(q.objeto).slice(0,50))}</option>`).join('')}
        <option value="novo" ${d.procId==='novo'?'selected':''}>＋ Criar processo novo com este documento</option></select></div>
      ${d.procId==='novo'?campo('numProcesso','Nº do processo no GIAP *','text')+campo('objeto','Objeto *','text')+campo('fornecedor','Fornecedor','text')+'<div class="fg"><label>Tipo do processo</label><select data-doc="'+d.id+'" data-k="tipoProc" data-t="text" onchange="lerCamposDoc(\''+d.id+'\')">'+TIPOS.map(t=>`<option ${x.tipoProc===t?'selected':''}>${t}</option>`).join('')+'</select></div>':''}
      ${(CAMPOS_DOC[x.tipo]||[]).map(([k,l,t])=>campo(k,l,t)).join('')}
      ${x.tipo==='Empenho'?`<label class="check full"><input type="checkbox" ${d.assinado?'checked':''} onchange="docsFila.find(q=>q.id==='${d.id}').assinado=this.checked;renderEnvioDocs()"> Este empenho já está assinado pelo ordenador de despesas</label>`:''}
    </div>
    ${d.duvida&&!d.procId?`<div style="font-size:12px;color:#f0c060;margin-top:10px">❓ ${esc(d.duvida)}</div>`:''}
    ${efeito?`<div style="font-size:12px;color:var(--muted);margin-top:10px">➜ ${efeito}</div>`:''}
    ${aviso?`<div class="aviso">${aviso}</div>`:''}
    <div class="mfooter" style="margin-top:12px"><button class="btn btn-ghost btn-sm" onclick="docsFila.find(q=>q.id==='${d.id}').status='ignorado';renderEnvioDocs()">Ignorar</button>
      <button class="btn btn-teal btn-sm" id="ap-${d.id}" onclick="aplicarDoc('${d.id}')" ${d.procId?'':'disabled'}>✔ Confirmar e aplicar</button></div></div>`;
}
function lerCamposDoc(id){
  const d = docsFila.find(q=>q.id===id);
  document.querySelectorAll(`[data-doc="${id}"]`).forEach(el=>{ let v=el.value.trim(); if(el.dataset.t==='money') v = parseBRL(v); d.dados[el.dataset.k] = (v===''?null:v); });
}
function escolherProcDoc(id, procId){
  lerCamposDoc(id); const d = docsFila.find(q=>q.id===id); d.procId = procId; d.sugestao = false; d.achadoPor = procId && procId!=='novo' ? 'escolhido' : '';
  if(procId==='novo'){ d.dados.objeto = d.dados.objeto || ''; d.dados.tipoProc = d.dados.tipoProc || 'Compra'; }
  renderEnvioDocs();
}
async function aplicarDoc(id){
  lerCamposDoc(id);
  const d = docsFila.find(q=>q.id===id); const x = d.dados; const btn = $('ap-'+id);
  const agora = new Date().toISOString(), hoje = hojeISO();
  let p;
  if(d.procId==='novo'){
    if(!x.numProcesso || !x.objeto){ alert('Para criar o processo, informe o nº do processo e o objeto.'); return; }
    const dup = Object.values(processos).find(q=>!q.cancelado && chaveNum(q.numProcesso)===chaveNum(x.numProcesso));
    if(dup && !confirm('Já existe o processo '+dup.numProcesso+' ('+dup.objeto+'). Criar outro mesmo assim?')) return;
    p = { id:novoId(), numProcesso:x.numProcesso, tipo:x.tipoProc||'Compra', objeto:x.objeto, fornecedor:x.fornecedor||null, dataAbertura:hoje, responsavel:nomeUsuario(), etapa:'aberto', etapaDesde:hoje,
          criadoEm:agora, criadoPor:nomeUsuario(), anexos:[], historico:[{ em:agora, por:nomeUsuario(), acao:'Processo criado a partir do documento '+d.file.name }] };
  } else {
    if(!processos[d.procId]){ alert('Escolha o processo.'); return; }
    p = JSON.parse(JSON.stringify(processos[d.procId]));
  }
  btn.disabled = true; btn.textContent = 'Aplicando...';
  try {
    await guardarAnexo(p, d.file, x.tipo==='Solicitação'?'Solicitação':x.tipo);
    const muda = [];
    const set = (k, v, rot) => { if(v==null || v==='') return; if(p[k]!==v){ p[k]=v; muda.push(rot); } };
    set('numSolicitacao', x.numSolicitacao, 'solicitação');
    if(x.tipo==='Empenho' || x.tipo==='AF'){ set('numEmpenho', x.numEmpenho, 'nº do empenho'); set('valorEmpenho', parseBRL(x.valorEmpenho), 'valor do empenho'); }
    if(x.tipo==='Empenho'){ set('dataEmpenho', x.dataEmpenho, 'data do empenho'); if(d.assinado) set('dataAssinatura', x.dataEmpenho||hoje, 'assinatura'); }
    if(x.tipo==='AF'){ set('numAF', x.numAF, 'nº da AF'); set('dataAF', x.dataAF||hoje, 'data da AF'); }
    if(x.tipo==='Nota fiscal'){ set('numNF', x.numNF, 'nº da NF'); set('valorNF', parseBRL(x.valorNF), 'valor da NF'); if(!p.dataNF) set('dataNF', hoje, 'data de recebimento'); if(!p.nfVia) p.nfVia='Upload no sistema'; if(!p.numAF) set('numAF', x.numAF, 'nº da AF'); }
    if(x.tipo==='Solicitação' && p.valorEstimado==null) set('valorEstimado', parseBRL(x.valorTotal), 'valor estimado');
    if(!p.fornecedor && x.fornecedor) set('fornecedor', x.fornecedor, 'fornecedor');
    // fornecedor: vincula ao cadastro, criando se ainda não existir
    if(p.fornecedor){
      let f = fornPorNome(p.fornecedor);
      if(!f){ f = { id:novoId(), nome:p.fornecedor, cnpj:x.cnpj||'', criadoEm:agora, criadoPor:nomeUsuario(), origem:'documento' }; await gravarFornecedor(f); }
      else if(x.cnpj && !f.cnpj){ await gravarFornecedor({...f, cnpj:x.cnpj}); }
      p.fornecedorId = f.id; p.fornecedor = f.nome;
    }
    const alvo = etapaAlvo(x.tipo, d.assinado); let txtEtapa = '';
    if(alvo && IDX[alvo] > IDX[p.etapa]){
      const de = ETAPAS[IDX[p.etapa]].nome;
      p.etapa = alvo; p.etapaDesde = (alvo==='af_emitida' ? (x.dataAF||hoje) : hoje);
      txtEtapa = ' · etapa: '+de+' → '+ETAPAS[IDX[alvo]].nome;
    }
    p.historico = (p.historico||[]).concat([{ em:agora, por:nomeUsuario(), acao:x.tipo+' recebido(a) e lido(a) pelo sistema'+txtEtapa, obs:d.file.name+(muda.length?' · atualizou: '+muda.join(', '):'') }]);
    await salvarProcesso(p);
    d.status = 'aplicado'; d.procId = p.id;
    // documentos que ainda não tinham processo podem ser encontrados agora (ex.: NF que cita a AF recém-aplicada)
    docsFila.filter(q=>q.status==='conferir' && (!q.procId || q.sugestao)).forEach(localizarProcesso);
    d.msg = 'Anexado ao processo <b>'+esc(p.numProcesso)+'</b>'+(muda.length?' · preenchido: '+esc(muda.join(', ')):'')+(txtEtapa?' · <b>'+esc(txtEtapa.replace(' · etapa: ','etapa: '))+'</b>':'');
    renderEnvioDocs(); renderTudo(); if(detId===p.id) abrirDetalhe(p.id);
  } catch(e){
    if(e.message && !e.message.startsWith('HTTP') && e.message!=='bloqueado') alert(e.message);
    btn.disabled = false; btn.textContent = '✔ Confirmar e aplicar';
  }
}

// ═══════════════ AVANÇAR ETAPA (com travas) ═══════════════
function abrirTransicao(id){
  if(!podeEditar()) return;
  if(processos[id] && processos[id].etapa==='af_emitida') return abrirMensagem(id, 'af');
  const p = processos[id]; const tr = TRANS[p.etapa]; if(!tr) return;
  const prox = ETAPAS[IDX[p.etapa]+1];
  let h = `<div class="modal-tit">${esc(tr.titulo)}</div><div class="modal-sub">Processo ${esc(p.numProcesso)} · ${esc(p.objeto)}<br>Depois de confirmar, o processo passa para <b style="color:#fff">${esc(prox.nome)}</b>.</div><div class="fgrid">`;
  tr.campos.forEach(c=>{
    const id2 = 'tr-'+c.k; const req = c.req?' <span class="req">*</span>':'';
    let ctl;
    let v = p[c.k]; if(c.t==='date' && !v) v = hojeISO(); if(c.k==='dataPrevista' && !p.dataPrevista) v = '';
    if(c.t==='select') ctl = `<select id="${id2}"><option value="">Selecione...</option>${c.op.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(c.t==='money') ctl = `<input id="${id2}" class="money" inputmode="decimal" placeholder="0,00" value="${esc(moneyInput(v!=null?v:(c.k==='valorNF'?p.valorEmpenho:null)))}">`;
    else if(c.t==='file') ctl = `<input id="${id2}" type="file" accept=".pdf,image/*">`;
    else ctl = `<input id="${id2}" type="${c.t}" value="${esc(v||'')}">`;
    h += `<div class="fg${c.full?' full':''}" id="w-${id2}"><label>${esc(c.l)}${req}</label>${ctl}</div>`;
  });
  (tr.checks||[]).forEach(c=>{ h += `<label class="check full" id="w-tr-${c.k}"><input type="checkbox" id="tr-${c.k}"> ${esc(c.l)}</label>`; });
  if(p.etapa!=='contabilidade') h += campoUnidade('trans', sugestaoTramite(p.etapa), '📍 Para onde o processo foi no GIAP (opcional; já vem a sugestão)', false);
  h += `${inp('trObs','Observação (opcional)','','text',{full:true})}</div><div id="tr-aviso"></div><div class="msg-erro" id="tr-erro"></div>
    <div class="mfooter"><button class="btn btn-ghost" onclick="fechar('ov-trans')">Cancelar</button><button class="btn btn-teal" id="btn-tr" onclick="confirmarTransicao('${id}')">Confirmar</button></div>`;
  $('trans-box').innerHTML = h; abrir('ov-trans'); iniciarListasUnid();
}
function lerArquivo(file){ return new Promise((ok,err)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=err; r.readAsDataURL(file); }); }
async function guardarAnexo(p, file, cat){
  if(file.size > LIMITE_ARQ_MB*1024*1024) throw new Error('O arquivo "'+file.name+'" tem mais de '+LIMITE_ARQ_MB+' MB. Reduza o tamanho e tente de novo.');
  const dados = await lerArquivo(file);
  const a = { id:novoId(), cat, nome:file.name, em:new Date().toISOString(), por:nomeUsuario() };
  await sbUpsert(PREFIXO_ANX+p.id+'_'+a.id, { nome:file.name, tipo:file.type, dados });
  p.anexos = (p.anexos||[]).concat([a]);
  return a;
}
async function confirmarTransicao(id){
  const p0 = processos[id]; const tr = TRANS[p0.etapa];
  document.querySelectorAll('#trans-box .fg,#trans-box .check').forEach(x=>x.classList.remove('erro'));
  const erros = []; const vals = {}; let arq = null, arqCat = null;
  tr.campos.forEach(c=>{
    const el = $('tr-'+c.k);
    if(c.t==='file'){ if(el.files[0]){ arq=el.files[0]; arqCat=c.cat; } else if(c.req){ erros.push(c.l); $('w-tr-'+c.k).classList.add('erro'); } return; }
    let v = el.value.trim(); if(c.t==='money') v = parseBRL(v);
    if(c.req && (v===''||v==null)){ erros.push(c.l); $('w-tr-'+c.k).classList.add('erro'); }
    vals[c.k] = (v===''?null:v);
  });
  (tr.checks||[]).forEach(c=>{ if(!$('tr-'+c.k).checked){ erros.push(c.l); $('w-tr-'+c.k).classList.add('erro'); } });
  if(erros.length){ $('tr-erro').innerHTML = 'Para avançar, falta:<br>• '+erros.map(esc).join('<br>• '); $('tr-erro').style.display='block'; return; }
  if(vals.dataPrevista && vals.afEnviadaEm && vals.dataPrevista < vals.afEnviadaEm){ $('tr-erro').textContent='A data prevista de entrega não pode ser antes do envio da AF.'; $('tr-erro').style.display='block'; return; }
  if(vals.valorNF!=null && p0.valorEmpenho!=null && Math.abs(vals.valorNF-p0.valorEmpenho)>0.009){
    if(!confirm('⚠ O valor da NF ('+fmtBRL(vals.valorNF)+') é diferente do valor empenhado ('+fmtBRL(p0.valorEmpenho)+').\n\nConfirme com o fornecedor antes de enviar para pagamento.\n\nRegistrar mesmo assim?')) return;
  }
  const btn = $('btn-tr'); btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    // confere se ninguém mexeu neste processo enquanto o formulário estava aberto
    const atual = await sbGetChave(PREFIXO+id);
    if(atual && atual.etapa !== p0.etapa){ processos[id]=atual; fechar('ov-trans'); renderTudo(); abrirDetalhe(id); alert('Outra pessoa já atualizou este processo. A tela foi recarregada com a versão mais recente.'); return; }
    const p = JSON.parse(JSON.stringify(atual || p0));
    if(arq) await guardarAnexo(p, arq, arqCat);
    Object.assign(p, vals);
    const de = p.etapa, para = ETAPAS[IDX[de]+1].id;
    p.etapa = para; p.etapaDesde = vals[tr.base] || hojeISO();
    const obs = $('ff-trObs').value.trim();
    p.historico = (p.historico||[]).concat([{ em:new Date().toISOString(), por:nomeUsuario(), acao:tr.titulo+' → '+ETAPAS[IDX[para]].nome, obs }]);
    const uT = _unidSel['trans'];
    if(uT && de!=='contabilidade'){ registrarTramite(p, uT, p.etapaDesde, ''); lembrarTramite(de, uT); p.historico.push({ em:new Date().toISOString(), por:nomeUsuario(), acao:'📍 Tramitado para '+uT.s+' — '+uT.d }); }
    await salvarProcesso(p);
    fechar('ov-trans'); toast('✅ '+tr.titulo); renderTudo(); if(detId===id) abrirDetalhe(id);
  } catch(e){ if(e.message && e.message!=='bloqueado' && !e.message.startsWith('HTTP')) alert(e.message); btn.disabled=false; btn.textContent='Confirmar'; }
}

async function voltarEtapa(id){
  const p = JSON.parse(JSON.stringify(processos[id])); const i = IDX[p.etapa]; if(i<=0) return;
  const ant = ETAPAS[i-1];
  const motivo = prompt('Voltar o processo para "'+ant.nome+'".\n\nMotivo (ex.: Compras devolveu para correção):'); if(motivo===null) return;
  p.etapa = ant.id; p.etapaDesde = hojeISO();
  p.historico.push({ em:new Date().toISOString(), por:nomeUsuario(), acao:'Voltou para "'+ant.nome+'"', obs:motivo });
  try { await salvarProcesso(p); toast('↩ Etapa revertida'); renderTudo(); abrirDetalhe(id); } catch(e){}
}
async function cancelarProcesso(id){
  const motivo = prompt('Motivo do cancelamento:'); if(motivo===null) return;
  const p = JSON.parse(JSON.stringify(processos[id]));
  Object.assign(p, { cancelado:true, canceladoEm:new Date().toISOString(), canceladoPor:nomeUsuario(), motivoCancel:motivo });
  p.historico.push({ em:p.canceladoEm, por:nomeUsuario(), acao:'Processo cancelado', obs:motivo });
  try { await salvarProcesso(p); toast('Processo cancelado'); renderTudo(); abrirDetalhe(id); } catch(e){}
}
async function reativarProcesso(id){
  const p = JSON.parse(JSON.stringify(processos[id])); p.cancelado=false; p.etapaDesde=hojeISO();
  p.historico.push({ em:new Date().toISOString(), por:nomeUsuario(), acao:'Processo reativado' });
  try { await salvarProcesso(p); toast('Processo reativado'); renderTudo(); abrirDetalhe(id); } catch(e){}
}
async function excluirProcesso(id){
  const p = processos[id];
  if(!confirm('Excluir o processo '+p.numProcesso+' do acompanhamento?\n\nUse isso só para cadastros feitos por engano. Para processos que não vão seguir, prefira "Cancelar processo".')) return;
  const q = JSON.parse(JSON.stringify(p)); q.excluido = true; q.excluidoPor = nomeUsuario(); q.excluidoEm = new Date().toISOString();
  try { await salvarProcesso(q); delete processos[id]; fechar('ov-det'); toast('🗑 Processo excluído'); renderTudo(); } catch(e){}
}

// ═══════════════ ANEXOS ═══════════════
async function anexarAvulso(id, input){
  const f = input.files[0]; if(!f) return;
  const p = JSON.parse(JSON.stringify(processos[id])); const cat = $('anx-cat').value;
  try {
    toast('⏳ Enviando '+f.name+'...');
    await guardarAnexo(p, f, cat);
    p.historico.push({ em:new Date().toISOString(), por:nomeUsuario(), acao:'Documento anexado: '+cat, obs:f.name });
    await salvarProcesso(p); toast('📎 Documento anexado'); abrirDetalhe(id);
  } catch(e){ if(e.message && !e.message.startsWith('HTTP') && e.message!=='bloqueado') alert(e.message); }
}
async function baixarAnexo(pid, aid){
  try {
    toast('⏳ Abrindo documento...');
    const d = await sbGetChave(PREFIXO_ANX+pid+'_'+aid);
    if(!d || !d.dados){ toast('Documento não encontrado', true); return; }
    const bin = atob(d.dados.split(',')[1]); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type:d.tipo||'application/octet-stream'}));
    const w = window.open(url, '_blank');
    if(!w){ const a=document.createElement('a'); a.href=url; a.download=d.nome; a.click(); }
  } catch(e){ toast('⚠ Não foi possível abrir o documento', true); }
}
async function removerAnexo(pid, aid){
  const p = JSON.parse(JSON.stringify(processos[pid])); const a = p.anexos.find(x=>x.id===aid);
  if(!confirm('Remover o documento "'+a.nome+'" deste processo?')) return;
  p.anexos = p.anexos.filter(x=>x.id!==aid);
  p.historico.push({ em:new Date().toISOString(), por:nomeUsuario(), acao:'Documento removido: '+a.cat, obs:a.nome });
  try { await salvarProcesso(p); try{ await sbUpsert(PREFIXO_ANX+pid+'_'+aid, { removido:true }); }catch(e){} abrirDetalhe(pid); } catch(e){}
}

// ═══════════════ PRAZOS (admin) ═══════════════
function abrirPrazos(){
  let h = `<div class="modal-tit">Prazos por etapa</div><div class="modal-sub">Quantos dias um processo pode ficar parado em cada etapa antes de aparecer como atrasado. Vale para todos os usuários.</div><div class="fgrid">`;
  ETAPAS.filter(e=>e.prazo!=null).forEach(e=>{ h += `<div class="fg"><label>${esc(e.nome)}</label><input type="number" min="0" id="pz-${e.id}" value="${prazoDe(e.id)}"></div>`; });
  h += `<div class="fg full"><label>📍 Avisar quando o processo estiver fora da SMCT há mais de (dias)</label><input type="number" min="1" id="pz-foraSMCT" value="${limiteFora()}"></div>`;
  h += `</div><div style="font-size:11px;color:var(--sub);margin-top:10px">"Aguardando entrega/serviço" usa a data prevista informada no envio da AF.</div>
    <div class="mfooter"><button class="btn btn-ghost" onclick="fechar('ov-prazos')">Cancelar</button><button class="btn btn-teal" onclick="salvarPrazos()">Salvar prazos</button></div>`;
  $('prazos-box').innerHTML = h; abrir('ov-prazos');
}
async function salvarPrazos(){
  const novo = {}; ETAPAS.filter(e=>e.prazo!=null).forEach(e=>{ const v=parseInt($('pz-'+e.id).value); if(!isNaN(v)&&v>=0) novo[e.id]=v; });
  const vf=parseInt($('pz-foraSMCT').value); if(!isNaN(vf)&&vf>0) novo.foraSMCT=vf;
  try { await sbUpsert(CHAVE_CFG, { prazos:novo }); prazos = novo; fechar('ov-prazos'); toast('✅ Prazos salvos'); renderTudo(); }
  catch(e){ toast('⚠ Não foi possível salvar os prazos', true); }
}

// ═══════════════ INÍCIO ═══════════════
(async function iniciar(){
  try { perfil = JSON.parse(localStorage.getItem('smct_perfil')||'{}'); } catch(e){ perfil = {}; }
  if(!perfil.email){
    $('carregando').innerHTML = `<div class="bloqueio"><div style="font-size:40px">🔒</div><h2>Entre pelo portal</h2><p>Este módulo usa o seu login do GestCultura.</p><a class="btn btn-teal" href="index.html" style="text-decoration:none;display:inline-block">Ir para o portal</a></div>`;
    return;
  }
  if(perfil.isAdmin!==true && perfil.acesso_processos===false){
    $('carregando').innerHTML = `<div class="bloqueio"><div style="font-size:40px">🔒</div><h2>Sem acesso a Processos de Contratação</h2><p>Peça a liberação para ${esc(perfil.contatoAdmin||'o administrador')}.</p><a class="btn btn-teal" href="index.html" style="text-decoration:none;display:inline-block">Voltar ao portal</a></div>`;
    return;
  }
  const b = $('smct-banner'); b.style.display='flex';
  $('banner-role').textContent = (perfil.isAdmin?'⚡ Admin':perfil.role==='editor'?'✏️ Editor':'👁 Visualizador')+' — '+nomeUsuario();
  $('banner-contato').textContent = perfil.contatoAdmin || 'o administrador';
  $('banner-info').textContent = podeEditar() ? 'Você pode cadastrar processos e registrar o andamento.' : 'Acesso somente leitura. Para registrar andamentos, solicite ao administrador.';
  if(!podeEditar()){ $('btn-novo').style.display='none'; $('btn-docs').style.display='none'; }
  if(perfil.isAdmin===true) $('btn-prazos').style.display='';
  try { await carregarTudo(); }
  catch(e){ cloudOk = false; toast('⚠ Não foi possível carregar os processos. Recarregue a página.', true); }
  $('carregando').style.display='none'; $('app').style.display='block';
  renderTudo(); ouvirTempoReal();
  document.addEventListener('visibilitychange', async ()=>{ if(document.visibilityState==='visible' && cloudOk){ try{ await carregarTudo(); renderTudo(); if(detId) abrirDetalhe(detId); }catch(e){} } });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') ['ov-trans','ov-docs','ov-form','ov-prazos','ov-det'].some(o=>{ if($(o).classList.contains('open')){ fechar(o); return true; } }); });
})();
