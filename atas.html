<style>
:root{--ink:#0f1923;--ink2:#1a2535;--ink3:#253347;--border:#2a3a50;--muted:#8a9bb0;--sub:#6a8a9a;--text:#e8f0f8;--gold:#c9a84c;--gold-l:#2a1e06;--gold-m:#3d2e0a;--teal:#2e7d4f;--teal-l:#0e2418;--teal-m:#1e4d30;--rose:#c0392b;--rose-l:#2a0a0a;--rose-m:#4a1a1a;--blue:#3a7bd5;--blue-l:#0a1a3a;--blue-m:#1a3a6a;--amber:#e0a030;--amber-l:#2a1e06;--amber-m:#5a4010;--sans:'DM Sans',sans-serif;--serif:'DM Serif Display',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--ink);color:var(--text);min-height:100vh}
button,input,select,textarea{font-family:var(--sans)}
.nav-bar{background:#0a1118;padding:7px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.nav-btn{display:flex;align-items:center;gap:6px;text-decoration:none;padding:5px 12px;border-radius:7px;font-size:11px;font-weight:600;border:1px solid var(--border);color:var(--muted);background:var(--ink2);transition:.15s;cursor:pointer;white-space:nowrap}
.nav-btn:hover{color:#fff;border-color:#3a5a70}
.nav-btn.green{background:var(--teal-l);border-color:var(--teal-m);color:#4cd98a}
.nav-btn.gold{background:var(--gold-l);border-color:var(--gold-m);color:var(--gold)}
.nav-btn.blue{background:var(--blue-l);border-color:var(--blue-m);color:#7ab3f0}
.nav-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}
.topbar{background:var(--ink2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar-logo{font-family:var(--serif);font-size:19px;color:#fff}
.topbar-sep{flex:1}
.pill{border-radius:8px;padding:5px 14px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid}
.pill-teal{background:var(--teal-l);border-color:var(--teal-m);color:#4cd98a}
.pill-rose{background:var(--rose-l);border-color:var(--rose-m);color:#f07a7a}
.pill-gold{background:var(--gold-l);border-color:var(--gold-m);color:var(--gold)}
.btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{background:#3a9e65}
.btn-gold{background:var(--gold);color:#1a1a0a}.btn-gold:hover{background:#dbb85a}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}.btn-ghost:hover{color:#fff;border-color:#3a5a70}
.btn-rose{background:transparent;border-color:var(--rose-m);color:#f07a7a}.btn-rose:hover{background:var(--rose-l)}
.btn-sm{padding:5px 10px;font-size:11px}
.sync{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;color:#fff;opacity:0;transition:opacity .3s}
.tabs{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid var(--border);background:var(--ink)}
.tab{padding:9px 16px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:7px}
.tab:hover{color:#fff}
.tab.active{background:var(--ink2);border-color:var(--border);color:#fff;margin-bottom:-1px}
.tab .cnt{background:var(--rose);color:#fff;border-radius:10px;font-size:10px;padding:1px 7px}
.main{padding:20px;max-width:1500px;margin:0 auto}
.stat-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sc{flex:1;min-width:150px;border:1px solid var(--border);border-radius:12px;padding:12px 16px;background:var(--ink2)}
.sc.teal{background:var(--teal-l);border-color:var(--teal-m)}.sc.rose{background:var(--rose-l);border-color:var(--rose-m)}.sc.gold{background:var(--gold-l);border-color:var(--gold-m)}.sc.blue{background:var(--blue-l);border-color:var(--blue-m)}
.sc-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--sub);margin-bottom:4px}
.sc-val{font-family:var(--serif);font-size:22px}
.sc.teal .sc-val{color:#4cd98a}.sc.rose .sc-val{color:#f07a7a}.sc.gold .sc-val{color:var(--gold)}.sc.blue .sc-val{color:#7ab3f0}
.sc-sub{font-size:10px;color:var(--sub);margin-top:3px}
.grupo{background:var(--ink2);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden}
.grupo.critico{border-color:#6b2a2a}
.grupo-hd{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border)}
.grupo-hd h3{font-family:var(--serif);font-size:17px;font-weight:400;color:#fff}
.grupo-hd p{font-size:11px;color:var(--sub)}
.grupo-hd .n{margin-left:auto;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;background:var(--ink3);color:var(--muted)}
.grupo.critico .grupo-hd .n{background:var(--rose);color:#fff}
.item{display:flex;align-items:center;gap:14px;padding:11px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.item:first-of-type{border-top:none}
.item:hover{background:var(--ink3)}
.item-main{flex:1;min-width:220px;cursor:pointer}
.item-tit{font-size:13px;font-weight:700;color:#fff}
.item-sub{font-size:11px;color:var(--muted);margin-top:2px}
.item-val{font-size:12px;font-weight:700;color:var(--gold);min-width:100px;text-align:right}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}
.chip.ok{background:var(--teal-m);color:#4cd98a}.chip.atencao{background:var(--amber-m);color:#f0c060}.chip.atrasado{background:#6b1a1a;color:#ffb0b0}.chip.neutro{background:var(--ink3);color:var(--muted)}.chip.pago{background:var(--blue-m);color:#7ab3f0}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:800;letter-spacing:.3px;white-space:nowrap;background:var(--ink3);color:var(--muted)}
.vazio{padding:18px;font-size:12px;color:#4cd98a;text-align:center}
.tudo-ok{background:var(--teal-l);border:1px solid var(--teal-m);border-radius:14px;padding:28px;text-align:center;color:#4cd98a;font-size:14px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filtros input:not([type=checkbox]),.filtros select{background:var(--ink2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-size:12px;outline:none}
.filtros input:not([type=checkbox]){min-width:240px}
.filtros label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{min-width:250px;width:250px;background:var(--ink2);border:1px solid var(--border);border-radius:12px;flex-shrink:0;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.col.critico{border-color:#6b2a2a}
.col-hd{padding:11px 13px;border-bottom:1px solid var(--border)}
.col-hd .t{font-size:12px;font-weight:800;color:#fff;display:flex;justify-content:space-between;gap:6px}
.col-hd .q{font-size:10px;color:var(--sub);margin-top:2px}
.col-body{padding:9px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.card{background:var(--ink);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:9px;padding:10px 11px;cursor:pointer;transition:.15s}
.card:hover{border-color:#3a5a70;transform:translateY(-1px)}
.card.atencao{border-left-color:var(--amber)}.card.atrasado{border-left-color:#e24b4a}.card.neutro{border-left-color:var(--border)}.card.pago{border-left-color:var(--blue)}
.card .np{font-size:11px;font-weight:800;color:var(--gold)}
.card .ob{font-size:12px;color:#fff;margin:4px 0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .fo{font-size:10px;color:var(--muted)}
.card .ft{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:6px}
.card .vl{font-size:11px;font-weight:700;color:var(--text)}
.tbl-wrap{background:var(--ink2);border:1px solid var(--border);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--ink);padding:9px 12px;font-size:9px;font-weight:800;letter-spacing:.7px;color:var(--sub);text-transform:uppercase;text-align:left;white-space:nowrap}
td{padding:10px 12px;font-size:12px;color:var(--text);border-top:1px solid var(--border);vertical-align:middle}
tr.click:hover td{background:var(--ink3);cursor:pointer}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;z-index:900;overflow-y:auto;padding:40px 16px}
.modal-ov.open{display:flex}
.modal{background:var(--ink2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:640px;padding:26px 28px}
.modal.lg{max-width:900px}
.modal-tit{font-family:var(--serif);font-size:20px;color:#fff;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.fg label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fg label .req{color:#f07a7a}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;background:var(--ink);border:1.5px solid var(--border);border-radius:9px;color:#fff;font-size:13px;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--teal)}
.fg input[type=file]{padding:7px;font-size:12px}
.fg textarea{min-height:64px;resize:vertical}
.fg.erro input,.fg.erro select{border-color:#e24b4a}
.sec-lbl{grid-column:1/-1;font-size:10px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-top:8px;padding-top:10px;border-top:1px solid var(--border)}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--ink);border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;cursor:pointer;font-size:13px;color:var(--text)}
.check input{width:17px;height:17px;accent-color:var(--teal);margin-top:1px;flex-shrink:0}
.check.erro{border-color:#e24b4a}
.mfooter{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.msg-erro{color:#f07a7a;font-size:12px;margin-top:12px;display:none}
.aviso{background:var(--amber-l);border:1px solid var(--amber-m);color:#f0c060;border-radius:9px;padding:10px 13px;font-size:12px;margin-top:12px}
.stepper{display:flex;gap:0;margin:14px 0 18px;overflow-x:auto;padding-bottom:4px}
.st{flex:1;min-width:70px;text-align:center;position:relative}
.st .dot{width:14px;height:14px;border-radius:50%;background:var(--ink3);border:2px solid var(--border);margin:0 auto 5px;position:relative;z-index:1}
.st::before{content:'';position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--border)}
.st:first-child::before{display:none}
.st.feito .dot{background:var(--teal);border-color:var(--teal)}.st.feito::before{background:var(--teal)}
.st.atual .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,168,76,.2)}.st.atual::before{background:var(--teal)}
.st .nm{font-size:9px;color:var(--sub);line-height:1.25}
.st.atual .nm{color:var(--gold);font-weight:800}
.det-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;margin-bottom:16px}
.det-grid .k{font-size:9px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.det-grid .v{font-size:13px;color:#fff;margin-top:2px;word-break:break-word}
.det-grid .v.vazio-v{color:#3a4a5a}
.det-sec{font-size:10px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px;padding-top:12px;border-top:1px solid var(--border)}
.acao-box{background:var(--teal-l);border:1px solid var(--teal-m);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.acao-box.critico{background:var(--rose-l);border-color:var(--rose-m)}
.acao-box .txt{flex:1;min-width:200px;font-size:12px;color:var(--muted)}
.acao-box .txt b{display:block;color:#fff;font-size:14px;margin-bottom:2px}
.anx{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:12px}
.anx .nm{flex:1;color:#fff;cursor:pointer;word-break:break-all}.anx .nm:hover{text-decoration:underline}
.hist{border-left:2px solid var(--border);margin-left:6px;padding-left:14px}
.hist .h{position:relative;padding:4px 0 10px;font-size:12px;color:var(--text)}
.hist .h::before{content:'';position:absolute;left:-19px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.hist .h small{display:block;color:var(--sub);font-size:10px}
.toast{position:fixed;bottom:24px;right:24px;background:#1a3a2a;border:1px solid var(--teal);color:#4cd98a;padding:11px 18px;border-radius:10px;font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;z-index:2000;pointer-events:none}
.toast.erro{background:#2a1a1a;border-color:#6b2a2a;color:#f08080}
.bloqueio{max-width:440px;margin:90px auto;text-align:center;background:var(--ink2);border:1px solid var(--border);border-radius:16px;padding:36px}
.bloqueio h2{font-family:var(--serif);font-weight:400;color:#fff;margin:10px 0}
.bloqueio p{font-size:13px;color:var(--muted);margin-bottom:18px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:12px}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:760px){.fgrid,.det-grid{grid-template-columns:1fr}.filtros input{min-width:0;width:100%}.main{padding:14px}.item-val{text-align:left}}
</style>
<style>
.cx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cx{background:var(--ink2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s}
.cx:hover{border-color:#3a5a70;transform:translateY(-2px)}
.cx.alerta{border-color:#6b4a10}
.cx .sg{font-size:16px;font-weight:800;color:#fff}
.cx .nm{font-size:10px;color:var(--sub);margin:2px 0 10px;line-height:1.35;min-height:27px}
.cx .vl{font-family:var(--serif);font-size:20px;color:#4cd98a}
.cx .lb{font-size:9px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.6px}
.bar{height:6px;border-radius:3px;background:var(--ink);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--gold)}
.cx .rod{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.mtx{border-collapse:collapse;width:100%}
.mtx th{position:sticky;top:0;z-index:1}
.mtx td,.mtx th{padding:7px 9px;font-size:11px;white-space:nowrap}
.mtx td.n{text-align:right;font-variant-numeric:tabular-nums}
.mtx td.desc{white-space:normal;min-width:220px}
.mtx td.z{color:#3a4a5a}
.mtx td.neg{background:#3a1010;color:#ffb0b0;font-weight:800}
.mtx td.baixo{background:#3a2a08;color:#f0c060;font-weight:700}
.n{text-align:right;font-variant-numeric:tabular-nums}
.ata-card{background:var(--ink2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.ata-hd{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;flex-wrap:wrap}
.ata-hd:hover{background:var(--ink3)}
.ata-hd .num{font-weight:800;color:var(--gold);font-size:14px;min-width:80px}

.ata-hd .fo small{display:block;color:var(--sub);font-size:11px}
.linha-item{display:grid;grid-template-columns:150px 1fr 120px 36px;gap:8px;align-items:end;margin-bottom:8px}
.linha-item .fg{margin:0}
.seg{display:flex;background:var(--ink);border:1.5px solid var(--border);border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.seg input{display:none}
.seg label.on{background:var(--teal);color:#fff}
.evt{background:var(--ink2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.evt h4{font-size:14px;color:#fff;font-weight:700}
.evt .meta{font-size:11px;color:var(--sub);margin:3px 0 8px}
.rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rel{background:var(--ink2);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.rel h4{font-size:14px;color:#fff;margin-bottom:4px}
.rel p{font-size:11px;color:var(--sub);margin-bottom:12px;line-height:1.5}
.rel .bts{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:760px){.linha-item{grid-template-columns:1fr 1fr}.linha-item>div:nth-child(2){grid-column:1/-1;order:-1}}
</style>
</head>

<script>

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseData(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function diasAte(s){ return Math.round((parseData(s)-parseData(hojeISO()))/86400000); }
function fmtData(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
function fmtBRL(v){ return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtN(v){ return Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:2}); }
function parseNum(s){ if(s==null) return null; s=String(s).trim().replace(/R\$\s?/,''); if(!s) return null; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?null:n; }

// Avisos de vencimento: 6, 5 e 4 meses (preparar licitação/renovação) e crítico a partir de 3 meses.
function somaMeses(iso, n){ const d=parseData(iso); const dia=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const ult=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(dia, ult)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const NIVEIS = {
  vencida: { ordem:0, cls:'atrasado', rotulo:'Vencida',            acao:'Registre a renovação, se houve. Sem renovação, a ata não pode mais ser usada.' },
  critico: { ordem:1, cls:'atrasado', rotulo:'Crítico · faltam 3 meses ou menos', acao:'A renovação ou a nova licitação já precisa estar em andamento.' },
  m4:      { ordem:2, cls:'atencao',  rotulo:'Faltam 4 meses',             acao:'Hora de abrir o processo de renovação ou de nova licitação.' },
  m5:      { ordem:3, cls:'atencao',  rotulo:'Faltam 5 meses',             acao:'Levante a demanda das secretarias e prepare o termo de referência.' },
  m6:      { ordem:4, cls:'pago',     rotulo:'Faltam 6 meses',             acao:'Comece a planejar a renovação ou a nova licitação.' }
};
function vigencia(a){
  const fim = fimVigente(a); const ren = !!ultimaRenovacao(a); const hoje = hojeISO();
  if(!fim) return { cls:'neutro', txt:'Sem vigência informada', vencida:false, ren, nivel:null };
  const d = diasAte(fim); const pre = ren ? 'Renovada · ' : '';
  let nivel = null;
  if(d<0) nivel='vencida'; else if(fim<=somaMeses(hoje,3)) nivel='critico'; else if(fim<=somaMeses(hoje,4)) nivel='m4'; else if(fim<=somaMeses(hoje,5)) nivel='m5'; else if(fim<=somaMeses(hoje,6)) nivel='m6';
  if(nivel==='vencida') return { cls:'atrasado', txt:(ren?'Renovação vencida em ':'Vencida em ')+fmtData(fim), vencida:true, ren, nivel, fim };
  if(nivel==='critico') return { cls:'atrasado', txt:'🚨 '+pre+'vence em '+d+' dia'+(d===1?'':'s')+' ('+fmtData(fim)+')', vencida:false, ren, nivel, fim };
  if(nivel) return { cls:NIVEIS[nivel].cls, txt:pre+'Vence em '+fmtData(fim)+' · '+d+' dias', vencida:false, ren, nivel, fim };
  return { cls:'ok', txt:(ren?'🔄 Renovada até ':'Vigente até ')+fmtData(fim), vencida:false, ren, nivel:null, fim };
}

// ═══════════════ SUPABASE ═══════════════
const H = () => ({ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' });
async function sbUpsertMuitos(linhas){
  for(let i=0;i<linhas.length;i+=150){
    const lote = linhas.slice(i,i+150).map(l=>({ chave:l.chave, valor:JSON.stringify(l.valor) }));
    const r = await fetch(SB_REST+'?on_conflict=chave', { method:'POST', headers:{...H(),'Prefer':'resolution=merge-duplicates'}, body:JSON.stringify(lote) });
    if(!r.ok) throw new Error('HTTP '+r.status);
  }
}
const sbUpsert = (chave, valor) => sbUpsertMuitos([{chave, valor}]);
async function sbGetChave(chave){
  const r = await fetch(SB_REST+'?chave=eq.'+encodeURIComponent(chave)+'&select=valor', { headers:H() });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows = await r.json(); return rows.length ? lerValor(rows[0].valor) : null;
}
async function sbListar(prefixo){
  let out = [], off = 0;
  while(true){
    const r = await fetch(SB_REST+'?chave=like.'+prefixo+'*&select=chave,valor&order=chave&limit=1000&offset='+off, { headers:H() });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json(); out = out.concat(rows);
    if(rows.length<1000) break; off += 1000;
  }
  return out.map(r=>lerValor(r.valor)).filter(Boolean);
}
async function carregarTudo(){
  base = await sbGetChave(CH_BASE);
  const [ms, es] = await Promise.all([sbListar(PX_MOV), sbListar(PX_EVT)]);
  movs = {}; ms.forEach(m=>{ if(m.id) movs[m.id]=m; });
  evts = {}; es.forEach(e=>{ if(e.id) evts[e.id]=e; });
}
function bloqueado(){ if(!cloudOk){ alert('⚠ A conexão falhou ao abrir esta página. Para proteger os dados, salvar está bloqueado. Recarregue a página (F5).'); return true; } return false; }
async function salvar(linhas){
  if(bloqueado()) throw new Error('bloqueado');
  sync('saving');
  try { await sbUpsertMuitos(linhas); sync('saved'); }
  catch(e){ sync('error'); toast('⚠ Não foi possível salvar. Verifique a internet e tente de novo.', true); throw e; }
}
async function salvarBase(){ base.atualizadoEm = new Date().toISOString(); base.atualizadoPor = nomeUsuario(); await salvar([{chave:CH_BASE, valor:base}]); }
function ouvirTempoReal(){
  try {
    const cli = supabase.createClient(SB_URL, SB_KEY);
    cli.channel('atas-rt').on('postgres_changes', { event:'*', schema:'public', table:'app_data' }, payload=>{
      const row = payload.new; if(!row || !row.chave) return;
      const v = lerValor(row.valor); if(!v) return;
      if(row.chave===CH_BASE) base = v;
      else if(row.chave.startsWith(PX_MOV)) movs[v.id] = v;
      else if(row.chave.startsWith(PX_EVT)) evts[v.id] = v;
      else return;
      recalcular(); renderTudo(); sync('live');
    }).subscribe();
  } catch(e){ console.warn('realtime', e); }
}

// ═══════════════ CÁLCULO DE SALDOS ═══════════════
function pos(itemId, secId){ const k=itemId+'|'+secId; return P[k] || (P[k]={ini:0,ent:0,sai:0,con:0,saldo:0}); }
function recalcular(){
  P = {};
  if(!base) return;
  base.saldos.forEach(s=>{ pos(s.itemId, s.secretariaId).ini += Number(s.qtdInicial)||0; });
  listaMov().forEach(m=>{
    const q = Number(m.quantidade)||0;
    if(m.tipo==='consumo') pos(m.itemId, m.origemId).con += q;
    else { pos(m.itemId, m.origemId).sai += q; if(m.destinoId) pos(m.itemId, m.destinoId).ent += q; }
  });
  Object.values(P).forEach(p=>{ p.saldo = p.ini + p.ent - p.sai - p.con; });
}
function posSe(itemId, secId){ return P[itemId+'|'+secId] || {ini:0,ent:0,sai:0,con:0,saldo:0}; }
function situacaoPos(p){
  const rec = p.ini + p.ent;
  if(p.saldo < -0.0001) return 'neg';
  if(rec>0 && p.saldo/rec*100 <= limite()) return 'baixo';
  return '';
}
function resumoItem(it){
  let dist=0, con=0, saldo=0;
  base.secretarias.forEach(s=>{ const p=posSe(it.id, s.id); dist+=p.ini; con+=p.con; saldo+=p.saldo; });
  return { reg:Number(it.qtdRegistrada)||0, dist, con, saldo };
}
function resumoSec(secId){
  let disp=0, cons=0, rec=0, usado=0, alertas=0, itens=0;
  base.itens.forEach(it=>{
    const p = posSe(it.id, secId); if(!(p.ini||p.ent||p.sai||p.con)) return;
    const vu = Number(it.valorUnitario)||0;
    disp += Math.max(0,p.saldo)*vu; cons += p.con*vu; rec += (p.ini+p.ent)*vu; usado += (p.con+p.sai)*vu; itens++;
    if(situacaoPos(p)) alertas++;
  });
  return { disp, cons, rec, usado, alertas, itens };
}
function alertasSaldo(){
  const out = [];
  base.itens.forEach(it=>{ const a=ata(it.ataId); base.secretarias.forEach(s=>{ const p=posSe(it.id,s.id); const st=situacaoPos(p); if(st && (p.con||p.sai||p.ent||st==='neg')) out.push({it,a,s,p,st}); }); });
  return out.sort((x,y)=>(x.st==='neg'?-1:0)-(y.st==='neg'?-1:0));
}

}

// ── Movimentações ──
function movFiltradas(){
  const q = norm(fMov.q);
  return listaMov().filter(m=>{
    const it = item(m.itemId)||{};
    if(fMov.tipo && m.tipo!==fMov.tipo) return false;
    if(fMov.sec && m.origemId!==fMov.sec && m.destinoId!==fMov.sec) return false;
    if(fMov.ata && it.ataId!==fMov.ata) return false;
    if(q){ const e=evts[m.eventoId]||{}; if(!norm([it.descricao,it.codigo,e.nome,m.solicitacao,m.obs,sigla(m.origemId),sigla(m.destinoId)].join(' ')).includes(q)) return false; }
    return true;
  }).sort((a,b)=>(b.data||'').localeCompare(a.data||'') || (b.criadoEm||'').localeCompare(a.criadoEm||''));
}

      <td>${esc(e?e.nome:'—')}</td><td>${esc(it.descricao)}<div style="font-size:10px;color:var(--sub)">Ata ${esc(a.numero)} · ${esc(it.codigo)}</div></td>

async function excluirMov(id){
  const m = movs[id]; const it = item(m.itemId)||{};

}

function setTipoMov(t){

function lerLinhasDoForm(){ movLinhas.forEach((l,i)=>{ const a=$('ln-ata-'+i), it=$('ln-it-'+i), q=$('ln-q-'+i); if(a) l.ataId=a.value; if(it) l.itemId=it.value; if(q) l.qtd=q.value; }); }

        ${p&&it?`<div style="font-size:10px;margin-top:4px;color:${p.saldo>0?'#4cd98a':'#f07a7a'}">Saldo de ${esc(sigla(orig))}: ${fmtN(p.saldo)} ${esc(it.unidade)}</div>`:''}</div>

async function salvarMov(){
  lerLinhasDoForm();
  const tipo = window._tipoMov; const data = $('mv-data').value; const orig = $('mv-orig').value; const dest = $('mv-dest').value;
  const evtNome = $('mv-evt').value.trim(); const sol = $('mv-sol').value.trim(); const obs = $('mv-obs').value.trim();
  const erros = [];
  if(!data) erros.push('Informe a data.');
  if(!orig) erros.push(tipo==='consumo'?'Escolha a secretaria que usou.':'Escolha a secretaria que cede o saldo.');
  if(tipo==='remanejamento' && !dest) erros.push('Escolha a secretaria que recebe.');
  if(tipo==='remanejamento' && dest && dest===orig) erros.push('A secretaria que recebe precisa ser diferente da que cede.');
  if(tipo==='consumo' && !evtNome) erros.push('Informe o evento.');
  const linhas = movLinhas.filter(l=>l.itemId || l.qtd);
  if(!linhas.length) erros.push('Adicione pelo menos um item.');
  const somaPorItem = {};
  linhas.forEach((l,i)=>{ const q=parseNum(l.qtd); if(!l.itemId) erros.push('Linha '+(i+1)+': escolha o item.'); if(!(q>0)) erros.push('Linha '+(i+1)+': quantidade inválida.'); else if(l.itemId) somaPorItem[l.itemId]=(somaPorItem[l.itemId]||0)+q; });
  if(erros.length){ $('mv-erro').innerHTML = erros.map(esc).join('<br>'); $('mv-erro').style.display='block'; return; }
  const estouro = Object.entries(somaPorItem).filter(([id,q])=>q > posSe(id,orig).saldo + 0.0001).map(([id,q])=>{ const it=item(id); return '• '+it.descricao+': pediu '+fmtN(q)+', saldo '+fmtN(posSe(id,orig).saldo)+' '+it.unidade; });
  if(estouro.length && !confirm('⚠ '+sigla(orig)+' não tem saldo suficiente:\n\n'+estouro.join('\n')+'\n\nO saldo vai ficar negativo. Registrar mesmo assim?')) return;
  const vencidas = [...new Set(linhas.map(l=>item(l.itemId).ataId))].map(ata).filter(a=>vigencia(a).vencida && data > fimVigente(a));
  if(vencidas.length && !confirm('⚠ '+vencidas.map(a=>'Ata '+a.numero+' venceu em '+fmtData(fimVigente(a))).join('\n')+'\n\nSe a ata foi renovada, registre a renovação em "Atas e itens".\n\nRegistrar mesmo assim?')) return;
  const novas = [];
  let eventoId = '';
  if(evtNome){
    const ex = listaEvt().find(e=>norm(e.nome)===norm(evtNome));
    if(ex) eventoId = ex.id;
    else { const e = { id:novoId(), nome:evtNome, data, local:'', secretariaId:orig, criadoEm:new Date().toISOString(), criadoPor:nomeUsuario() }; eventoId=e.id; novas.push({chave:PX_EVT+e.id, valor:e}); }
  }
  const criadoEm = new Date().toISOString();
  const ms = linhas.map(l=>({ id:novoId(), criadoEm, criadoPor:nomeUsuario(), data, tipo, itemId:l.itemId, origemId:orig, destinoId:tipo==='remanejamento'?dest:'', eventoId, quantidade:parseNum(l.qtd), obs, solicitacao:sol }));
  ms.forEach(m=>novas.push({chave:PX_MOV+m.id, valor:m}));
  $('btn-mv').disabled = true;
  try {
    await salvar(novas);
    novas.forEach(n=>{ if(n.chave.startsWith(PX_EVT)) evts[n.valor.id]=n.valor; else movs[n.valor.id]=n.valor; });
    recalcular(); fechar('ov-a'); toast('✅ '+ms.length+' item(ns) registrado(s)'); renderTudo();
  } catch(e){ $('btn-mv').disabled = false; }
}

function renovarAta(id){
  if(!podeEditar()) return;

async function importarBackup(input){
  const f = input.files[0]; input.value=''; if(!f) return;
  if(!isAdmin()){ alert('Só o administrador pode importar backup.'); return; }
  let d; try { d = JSON.parse(await f.text()); } catch(e){ alert('Este arquivo não é um backup válido (.json).'); return; }
  const ok = d && ['atas','itens','secretarias','saldos','movimentos'].every(k=>Array.isArray(d[k]));
  if(!ok){ alert('Este arquivo não parece ser um backup do controle de atas.'); return; }
  const atual = listaMov().length;
  if(!confirm('Importar o backup "'+f.name+'"?\n\nBackup: '+d.atas.length+' atas · '+d.itens.length+' itens · '+d.secretarias.length+' secretarias · '+d.movimentos.length+' movimentações'+(d.meta&&d.meta.atualizadoEm?'\nGerado em: '+new Date(d.meta.atualizadoEm).toLocaleString('pt-BR'):'')+'\n\n'+(base?'⚠ Isso SUBSTITUI tudo o que está aqui hoje ('+atual+' movimentações).':'')+'\n\nContinuar?')) return;
  if(bloqueado()) return;
  const quem = nomeUsuario(), agora = new Date().toISOString();
  const novaBase = { atas:d.atas, itens:d.itens, secretarias:d.secretarias, saldos:d.saldos, config:d.config||{limiteAlerta:20}, importadoEm:agora, importadoPor:quem, importadoDe:f.name, atualizadoEm:agora, atualizadoPor:quem };
  const linhas = [{chave:CH_BASE, valor:novaBase}];
  const idsMov = new Set(d.movimentos.map(m=>m.id)), idsEvt = new Set((d.eventos||[]).map(e=>e.id));
  d.movimentos.forEach(m=>linhas.push({chave:PX_MOV+m.id, valor:m}));
  (d.eventos||[]).forEach(e=>linhas.push({chave:PX_EVT+e.id, valor:e}));
  Object.values(movs).forEach(m=>{ if(!idsMov.has(m.id) && !m.excluido) linhas.push({chave:PX_MOV+m.id, valor:{...m, excluido:true, excluidoPor:quem+' (importação)', excluidoEm:agora}}); });
  Object.values(evts).forEach(e=>{ if(!idsEvt.has(e.id) && !e.excluido) linhas.push({chave:PX_EVT+e.id, valor:{...e, excluido:true}}); });
  toast('⏳ Importando...');
  try { await salvar(linhas); await carregarTudo(); recalcular(); $('btn-mov').style.display = podeEditar()?'':'none'; setTab('painel'); toast('✅ Backup importado: '+d.movimentos.length+' movimentações'); }
  catch(e){ alert('⚠ A importação não terminou. Tente de novo; nada do backup se perde, porque ele continua no arquivo.'); }

  try { perfil = JSON.parse(localStorage.getItem('smct_perfil')||'{}'); } catch(e){ perfil = {}; }
  if(!perfil.email){
    $('carregando').innerHTML = `<div class="bloqueio"><div style="font-size:40px">🔒</div><h2>Entre pelo portal</h2><p>Este módulo usa o seu login do GestCultura.</p><a class="btn btn-teal" href="index.html" style="text-decoration:none;display:inline-block">Ir para o portal</a></div>`;
    return;
  }
  if(perfil.isAdmin!==true && perfil.acesso_atas===false){
    $('carregando').innerHTML = `<div class="bloqueio"><div style="font-size:40px">🔒</div><h2>Sem acesso a Controle de Atas</h2><p>Peça a liberação para ${esc(perfil.contatoAdmin||'o administrador')}.</p><a class="btn btn-teal" href="index.html" style="text-decoration:none;display:inline-block">Voltar ao portal</a></div>`;
    return;
  }
  $('smct-banner').style.display='flex';
  $('banner-role').textContent = (perfil.isAdmin?'⚡ Admin':perfil.role==='editor'?'✏️ Editor':'👁 Visualizador')+' — '+nomeUsuario();
  $('banner-contato').textContent = perfil.contatoAdmin || 'o administrador';
  $('banner-info').textContent = isAdmin() ? 'Acesso total: lançamentos, atas, distribuição e backup.' : podeEditar() ? 'Você pode registrar consumos e remanejamentos.' : 'Acesso somente leitura.';
  if(!podeEditar()) $('btn-mov').style.display='none';
  try { await carregarTudo(); }
  catch(e){ cloudOk = false; toast('⚠ Não foi possível carregar as atas. Recarregue a página.', true); }
  if(!base) $('btn-mov').style.display='none';
  recalcular();
  $('carregando').style.display='none'; $('app').style.display='block';
  renderTudo(); ouvirTempoReal();
  document.addEventListener('visibilitychange', async ()=>{ if(document.visibilityState==='visible' && cloudOk && !document.querySelector('.modal-ov.open')){ try{ await carregarTudo(); recalcular(); renderTudo(); }catch(e){} } });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') ['ov-b','ov-a'].some(o=>{ if($(o).classList.contains('open')){ fechar(o); return true; } }); });
})();
</script>
</body>
</html>
